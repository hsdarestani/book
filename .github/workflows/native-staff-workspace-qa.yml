name: Native staff workspace PostgreSQL checks

on:
  pull_request:
    paths:
      - 'booking/mobile_staff_api.py'
      - 'booking/test_mobile_staff_workspace.py'
      - '.github/workflows/native-staff-workspace-qa.yml'

permissions:
  contents: read

jobs:
  staff-workspace:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: staff_qa
          POSTGRES_PASSWORD: staff_qa
          POSTGRES_DB: staff_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U staff_qa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DB_ENGINE: postgresql
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: staff_qa
      DB_USER: staff_qa
      DB_PASSWORD: staff_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test booking.test_mobile_staff_workspace booking.test_patient_identity_review --noinput
