name: Temporary SimplyBook contact fidelity tests
on:
  push:
    branches: [fix/simplybook-source-contact-fidelity-20261022]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test migration and source contact fidelity
        env:
          DJANGO_DEBUG: '1'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test booking.test_simplybook_sync_integrity booking.test_dashboard_content_management booking.test_full_surface_regression
