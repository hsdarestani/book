name: Calendar iPhone regression (no deploy)

on:
  pull_request:
    paths:
      - "static/booking/admin.js"
      - "static/booking/admin-calendar-plus.js"
      - "static/booking/admin-calendar-iphone-v1.*"
      - "booking/test_iphone_calendar.py"
      - ".github/workflows/iphone-calendar-pr.yml"

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run calendar and mobile regression suite
        run: python manage.py test booking.test_iphone_calendar booking.test_fast_calendar_and_login booking.test_admin_mobile_flow
      - name: Check Django system configuration
        run: python manage.py check
