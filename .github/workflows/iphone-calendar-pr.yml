name: Calendar iPhone regression (no deploy)

on:
  pull_request:
    paths:
      - "static/booking/admin.js"
      - "static/booking/admin-calendar-plus.js"
      - "static/booking/admin-calendar-iphone-v1.*"
      - "booking/test_iphone_calendar.py"
      - "booking/test_calendar_sheet_correctness.py"
      - "booking/test_premium_design.py"
      - "booking/admin_views.py"
      - "booking/doctor_views.py"
      - "static/booking/admin-ferrari-v17.js"
      - "static/booking/admin-calendar-sheet-fix-v3.css"
      - "static/booking/admin-calendar-date-dock-v7.css"
      - "templates/booking/_mobile_calendar_date_dock.html"
      - "booking/views.py"
      - "booking/test_doctor_read_only.py"
      - "templates/booking/app_wallet_management.html"
      - "templates/booking/app_management.html"
      - "static/booking/clinic-signature-surfaces-v1.css"
      - "templates/booking/dashboard.html"
      - "booking/app_admin_middleware.py"
      - "booking/test_full_surface_regression.py"
      - ".github/workflows/iphone-calendar-pr.yml"

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run complete Django regression suite before production merge
        run: python manage.py test
      - name: Check Django system configuration
        run: python manage.py check
