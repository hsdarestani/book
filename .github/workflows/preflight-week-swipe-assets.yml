name: Read-only production preflight for week-swipe hotfix

on:
  push:
    branches:
      - audit/book-botox-duration-20261122
    paths:
      - ".github/workflows/preflight-week-swipe-assets.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Compare live app and collected static assets to main (no writes)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            APP=/opt/aesthetic-book/app
            MAIN=29433dfc865c3f52e1d65f47148f791920dab128
            FIX=fbe44abde1ec929d67a6299a1965470afb340b91
            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT
            test "$(git -C "$APP" rev-parse HEAD)" = "$MAIN"
            systemctl is-active --quiet aesthetic-book
            curl -fsS --max-time 15 https://book.a-esthetic.de/api/health/ >/dev/null
            for f in static/booking/admin.js static/booking/admin-calendar-iphone-v1.js templates/booking/dashboard.html; do
              mkdir -p "$TMP/$(dirname "$f")"
              curl -fsSL --max-time 30 "https://raw.githubusercontent.com/hsdarestani/book/$MAIN/$f" -o "$TMP/$f"
              cmp -s "$APP/$f" "$TMP/$f"
              echo "Matches main: $f"
            done
            cmp -s "$APP/staticfiles/booking/admin.js" "$TMP/static/booking/admin.js"
            cmp -s "$APP/staticfiles/booking/admin-calendar-iphone-v1.js" "$TMP/static/booking/admin-calendar-iphone-v1.js"
            echo 'Collected static files match main'
            for f in static/booking/admin.js static/booking/admin-calendar-iphone-v1.js templates/booking/dashboard.html; do
              curl -fsSL --max-time 30 "https://raw.githubusercontent.com/hsdarestani/book/$FIX/$f" -o "$TMP/$(basename "$f").fix"
            done
            grep -q 'suppressStripClickUntil' "$TMP/admin-calendar-iphone-v1.js.fix"
            grep -q '20261122-weekswipe1' "$TMP/admin.js.fix"
            grep -q '20261122-weekswipe1' "$TMP/dashboard.html.fix"
            echo 'SAFE PREFLIGHT: no unintended drift and all 3 fixed files available'
