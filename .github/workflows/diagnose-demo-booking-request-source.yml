name: Investigate source of demo app booking request
on:
  push:
    branches: [fix/block-unauthorized-demo-app-bookings-20261019]
    paths:
      - ".github/workflows/diagnose-demo-booking-request-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect sanitized proxy and application request metadata
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            echo "PRODUCTION_DEMO_REQUEST_AUDIT"
            python3 - <<'PY'
            import re, subprocess
            from pathlib import Path
            candidates=['/var/log/nginx/access.log','/var/log/caddy/access.log']
            keys=['POST /api/mobile/booking/','POST /api/mobile/booking?']
            for path in candidates:
                p=Path(path)
                if not p.is_file(): continue
                hits=0
                for line in p.open(errors='replace'):
                    if not any(k in line for k in keys): continue
                    if '19/Oct/2026:19:5' not in line and '19/Oct/2026:20:0' not in line: continue
                    line=re.sub(r'(?:(?:\d{1,3}\.){3}\d{1,3})','[IP]',line)
                    line=re.sub(r'(?i)(authorization|cookie|token|password)=[^\s"&]+',r'\1=[REDACTED]',line)
                    print('PROXY_HIT',p.name,line.strip()[:450])
                    hits+=1
                    if hits>=25: break
                print('PROXY_MATCH_COUNT_SHOWN',p.name,hits)
            cmd=['journalctl','-u','aesthetic-book.service','--since','2026-10-19 19:50:00 UTC','--until','2026-10-19 20:10:00 UTC','--no-pager','-o','short-iso']
            p=subprocess.run(cmd,capture_output=True,text=True)
            hits=0
            for line in p.stdout.splitlines():
                if 'POST /api/mobile/booking/' not in line: continue
                line=re.sub(r'(?:(?:\d{1,3}\.){3}\d{1,3})','[IP]',line)
                print('BACKEND_REQUEST',line[:400])
                hits+=1
                if hits>=25: break
            print('BACKEND_REQUEST_COUNT_SHOWN',hits)
            PY
            echo "SYNC_TRIGGER_FILES"
            grep -RnlE 'sync_simplybook_continuous|simplybook_import' /etc/systemd/system /etc/cron.d 2>/dev/null | head -12 || true
