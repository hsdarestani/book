name: GOÄ MediLogin reference browser QA — no deployment
on:
  push:
    branches: [feature/medi-login-goae-rechner-parity-20261123]
    paths:
      - 'templates/booking/_billing_goae_form.html'
      - 'static/booking/goae-rechner-v2.js'
      - 'static/booking/goae-rechner-v2.css'
      - 'booking/app_management_views.py'
      - 'scripts/test_goae_reference_browser.py'
      - '.github/workflows/goae-reference-browser-qa.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      DJANGO_DEBUG: '1'
      DJANGO_ALLOWED_HOSTS: '127.0.0.1,localhost,testserver,aesthetic-synthetic.test'
      DATABASE_URL: 'sqlite:///synthetic-goae-reference-test.sqlite3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Django and Chromium
        run: |
          pip install -r requirements.txt
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Compile and run Book regression tests
        run: |
          node --check static/booking/goae-rechner-v2.js
          python manage.py check
          python manage.py test booking.test_same_domain_invoices booking.test_premium_design booking.test_clinic_readable_ui --verbosity 1
      - name: Run real Chromium UI flow with synthetic information
        run: python scripts/test_goae_reference_browser.py
      - name: Upload screenshot on pass/fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goae-reference-mobile-390
          path: /tmp/goae-mobile-390.png
          if-no-files-found: ignore
