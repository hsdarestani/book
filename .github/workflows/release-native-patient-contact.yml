name: Guarded Book patient contact release

on:
  push:
    branches: [release/book-native-patient-contact]
    paths: ['.github/workflows/release-native-patient-contact.yml']

permissions:
  contents: read

concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false

env:
  CONTACT_BOOK_LIVE_BASE_SHA: b66979a745fec9879052aaf152ba3306e0fa98a0
  CONTACT_BOOK_RELEASE_SHA: d48fd7937000818c7ec0f43e8cb7616e8ab6bb6e

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.scope.outputs.target }}
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Pin and verify the contact-only source delta
        run: |
          set -euo pipefail
          target="$CONTACT_BOOK_RELEASE_SHA"
          git merge-base --is-ancestor "$target" HEAD
          test "$(git rev-parse "$target^")" = "$CONTACT_BOOK_LIVE_BASE_SHA"
          diff -u <(cat <<'FILES'
          booking/admin.py
          booking/admin_dashboard_views.py
          booking/admin_views.py
          booking/app_admin_api.py
          booking/app_management_views.py
          booking/migrations/0038_staff_patient_contact.py
          booking/mobile_staff_api.py
          booking/models.py
          booking/staff_patient_search.py
          booking/test_mobile_staff_workspace.py
          booking/urls.py
          templates/booking/admin_dashboard_lambo.html
          templates/booking/app_management.html
          templates/booking/dashboard.html
          templates/booking/doctor_appointments.html
          templates/booking/patient_file.html
          FILES
          ) <(git diff --name-only "$CONTACT_BOOK_LIVE_BASE_SHA" "$target")
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Validate the additive migration and SimplyBook regressions
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py test booking.test_mobile_staff_workspace booking.test_simplybook_calendar_writeback booking.test_simplybook_sync_integrity booking.test_patient_identity_review booking.test_app_admin_api booking.test_app_management --noinput

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    env:
      CONTACT_BOOK_RELEASE_SHA: ${{ needs.verify.outputs.target }}
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: CONTACT_BOOK_LIVE_BASE_SHA,CONTACT_BOOK_RELEASE_SHA
          command_timeout: 12m
          script: |
            set -euo pipefail
            app=/opt/aesthetic-book/app
            env_file=/etc/aesthetic-book.env
            calendar_config=/etc/systemd/system/aesthetic-book.service.d/56-simplybook-calendar-writeback.conf
            cd "$app"
            exec 9>/opt/aesthetic-book/remediation-rollbacks/release.lock
            flock -n 9
            test "$(git rev-parse HEAD)" = "$CONTACT_BOOK_LIVE_BASE_SHA"
            test -z "$(git status --porcelain --untracked-files=no)"
            systemctl is-active --quiet aesthetic-book
            config_before=$(sha256sum "$env_file" "$calendar_config")
            git fetch --no-tags origin "$CONTACT_BOOK_RELEASE_SHA"
            test "$(git rev-parse "$CONTACT_BOOK_RELEASE_SHA^")" = "$CONTACT_BOOK_LIVE_BASE_SHA"
            original_branch=$(git symbolic-ref --quiet --short HEAD || true)
            stage=$(mktemp -d /opt/aesthetic-book/.patient-contact-stage.XXXXXXXX)
            switched=0
            finish() {
              result=$?
              trap - EXIT
              if [ "$result" != 0 ] && [ "$switched" = 1 ]; then
                if [ -n "$original_branch" ]; then
                  git switch --no-overwrite-ignore "$original_branch"
                else
                  git switch --no-overwrite-ignore --detach "$CONTACT_BOOK_LIVE_BASE_SHA"
                fi &&
                  systemctl restart aesthetic-book &&
                  systemctl is-active --quiet aesthetic-book &&
                  echo 'Book contact source rolled back. Additive columns retained.' || result=2
              fi
              git worktree remove "$stage" >/dev/null 2>&1 || true
              exit "$result"
            }
            trap finish EXIT
            git worktree add --detach "$stage" "$CONTACT_BOOK_RELEASE_SHA"
            chmod 0755 "$stage"
            django_at() {
              runuser -u aestheticbook -- bash -c '
                set -ae
                source "$1"
                cd "$2"
                shift 2
                exec /opt/aesthetic-book/venv/bin/python manage.py "$@"
              ' bash "$env_file" "$@"
            }
            django_at "$stage" check
            django_at "$stage" shell <<'PY'
            from django.db import connection
            from django.db.migrations.executor import MigrationExecutor
            executor = MigrationExecutor(connection)
            executor.loader.check_consistent_history(connection)
            assert ('booking', '0037_simplybook_calendar_revision') in executor.loader.applied_migrations
            plan = [(migration.app_label, migration.name, backwards)
                    for migration, backwards in executor.migration_plan(executor.loader.graph.leaf_nodes())]
            assert plan in ([], [('booking', '0038_staff_patient_contact', False)]), 'Unexpected migration plan'
            PY
            django_at "$stage" migrate booking 0038_staff_patient_contact --noinput
            test "$(sha256sum "$env_file" "$calendar_config")" = "$config_before"
            git switch --no-overwrite-ignore --detach "$CONTACT_BOOK_RELEASE_SHA"
            switched=1
            systemctl restart aesthetic-book
            for attempt in {1..12}; do
              code=$(curl -s --max-time 8 -o /dev/null -w '%{http_code}' https://book.a-esthetic.de/api/mobile/staff/patient/1/contact/ || true)
              if systemctl is-active --quiet aesthetic-book && [ "$code" = 401 ]; then
                test "$(sha256sum "$env_file" "$calendar_config")" = "$config_before"
                echo "BOOK_CONTACT_DEPLOYED=$CONTACT_BOOK_RELEASE_SHA"
                exit 0
              fi
              sleep 2
            done
            exit 1
