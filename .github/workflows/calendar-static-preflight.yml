name: Read-only calendar asset serving preflight
on:
  push:
    branches: [qa/private-existing-record-diagnostics-20261127]
    paths: ['.github/workflows/calendar-static-preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            test "$(git rev-parse HEAD)" = 81ccfa136d0ed44cdaea959fae45982d98df8a92
            test -z "$(git status --porcelain --untracked-files=no)"
            for name in admin.js admin-calendar-plus.js; do
              test -f "static/booking/$name"
              if test -f "staticfiles/booking/$name" && cmp -s "static/booking/$name" "staticfiles/booking/$name"; then
                echo "COLLECTED_ASSET_MATCH_$name=yes"
              else
                echo "COLLECTED_ASSET_MATCH_$name=no"
              fi
            done
            if test -f staticfiles/staticfiles.json; then echo STATIC_MANIFEST_PRESENT=yes; else echo STATIC_MANIFEST_PRESENT=no; fi
            echo BOOK_SOURCE_CLEAN=yes
