name: Validate clinic email routing and admin reminders
on:
  push:
    branches: [fix/admin-email-info-bcc-and-reminders-20261105]
    paths:
      - 'booking/**'
      - 'config/**'
      - '.env.example'
      - '.github/workflows/ci-deploy.yml'
      - '.github/workflows/validate-admin-reminders-20261105.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify syntax, schema, and delivery tests
        env:
          DJANGO_DEBUG: '1'
        run: |
          python -m compileall -q booking config
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test booking.test_admin_notification_routing booking.test_customer_email booking.tests
      - name: Full regression test suite
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py test
