name: Validate A+ Esthetic Booking (guarded release separately)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aesthetic-book-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check forbidden brand possessives
        run: python scripts/check_no_unser_copy.py

      - name: Validate Django project
        env:
          DJANGO_DEBUG: '1'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test
          python manage.py collectstatic --noinput

      - name: Check GOÄ reference calculator in Chromium
        env:
          DJANGO_DEBUG: '1'
          DJANGO_ALLOWED_HOSTS: '127.0.0.1,localhost,testserver,aesthetic-synthetic.test'
        run: |
          node --check static/booking/goae-rechner-v2.js
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python scripts/test_goae_reference_browser.py


  production-release-notice:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Production releases use the pinned guarded Book release workflow; no environment, seed, password or reminder actions are performed here.'
