name: Book native source collision check (read-only)
on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/book-native-source-collision-check.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            test "$(git rev-parse HEAD)" = c2caac56e943daf9f14082cc87bc2a4c3a158cb5
            git fetch --no-tags origin a5149246445de713cbe5d7bfa2c517e611875a3f 69116b985b5a78e1d7a7a6043649c772164059da 69750ebb94d1db1a75747181e625db558414fd2b
            for path in booking/mobile_staff_api.py booking/management/commands/reconcile_mobile_cancellations.py; do
              test -f "$path" && test ! -L "$path"
              echo "COLLISION_PATH=$path"
              if git show "a5149246445de713cbe5d7bfa2c517e611875a3f:$path" | cmp -s "$path" -; then
                echo 'MATCH=target'
              elif git show "69116b985b5a78e1d7a7a6043649c772164059da:$path" | cmp -s "$path" -; then
                echo 'MATCH=reconciled_candidate'
              elif git show "69750ebb94d1db1a75747181e625db558414fd2b:$path" | cmp -s "$path" -; then
                echo 'MATCH=previous_native_candidate'
              else
                echo 'MATCH=unknown_local_content'
              fi
            done
            systemctl is-active --quiet aesthetic-book && echo 'LIVE_RESTORED=yes'
