name: Guarded Book user acceptance correction release

on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/book-admin-batch.yml']

permissions:
  contents: read
concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false

env:
  BOOK_BASELINE: 0c3a8108812732091b3732cfdeed59340c95c08b
  BOOK_TARGET: 4e8832baf07354a3b4f264d5a32d744fa1bb6470
  BOOK_TOOLS_REF: ${{ github.sha }}

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BOOK_TARGET }}
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - name: Verify restorable checkout and the approved file list
        run: |
          bash scripts/test_book_phase_a_rollback.sh
          git -C candidate fetch --no-tags origin "$BOOK_BASELINE"
          git -C candidate diff --name-only "$BOOK_BASELINE" "$BOOK_TARGET" | cmp -s scripts/book_admin_web_scope.txt -
          test ! -e candidate/static/booking/calendar-mobile-sticky-day-header-v1.css

      - name: Verify focused integrated user acceptance scenarios
        working-directory: candidate
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
          python manage.py check
          python manage.py makemigrations --check --dry-run
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver python manage.py test booking.test_acceptance_polish_browser --noinput

  release:
    needs: rehearse
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: BOOK_BASELINE,BOOK_TARGET,BOOK_TOOLS_REF
          script: |
            set -euo pipefail
            app=/opt/aesthetic-book/app
            git -C "$app" fetch --no-tags origin "$BOOK_TOOLS_REF" "$BOOK_TARGET"
            tools="$(mktemp -d)"
            trap 'rm -rf -- "$tools"' EXIT
            for name in book_phase_a_release.sh book_admin_web_release.sh book_admin_web_scope.txt check_admin_web_schema.py book_phase_a_smoke.py; do
              git -C "$app" show "$BOOK_TOOLS_REF:scripts/$name" > "$tools/$name"
            done
            bash "$tools/book_admin_web_release.sh" "$BOOK_BASELINE" "$BOOK_TARGET"
            # Reconcile only pre-existing unassigned signed forms; aggregates only.
            run_book() {
              runuser -u aestheticbook -- bash -c 'set -ae; source /etc/aesthetic-book.env; cd /opt/aesthetic-book/app; exec /opt/aesthetic-book/venv/bin/python manage.py "$@"' bash "$@"
            }
            preview=$(run_book reconcile_office_intake)
            printf '%s\n' "$preview"
            if printf '%s\n' "$preview" | grep -Eq '^(matched|created)=[1-9][0-9]*$'; then
              # A recoverable private DB snapshot before altering historic records.
              umask 077
              backup=$(mktemp -d /opt/aesthetic-book/remediation-rollbacks/intake-reconciliation.XXXXXXXX)
              if ! runuser -u aestheticbook -- bash -c 'set -ae; source /etc/aesthetic-book.env; cd /opt/aesthetic-book/app; exec /opt/aesthetic-book/venv/bin/python -c "$1"' bash '
            import os, subprocess
            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
            import django
            django.setup()
            from django.conf import settings
            db = settings.DATABASES["default"]
            assert "postgresql" in db["ENGINE"]
            env = os.environ.copy()
            for key, name in (("NAME","PGDATABASE"),("USER","PGUSER"),("PASSWORD","PGPASSWORD"),("HOST","PGHOST"),("PORT","PGPORT")):
                if db.get(key): env[name] = str(db[key])
            subprocess.run(["pg_dump","--format=custom"], env=env, check=True)
            ' > "$backup/office-before.dump" 2>"$backup/backup.log"; then
                echo 'INTAKE_RECONCILIATION=blocked_backup_failed'; exit 1
              fi
              pg_restore --list "$backup/office-before.dump" >/dev/null 2>"$backup/verify.log"
              echo 'INTAKE_BACKUP_VERIFIED=yes'
              run_book reconcile_office_intake --apply
            else
              echo 'INTAKE_RECONCILIATION=no_eligible_forms'
            fi
