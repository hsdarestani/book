name: Guarded SimplyBook production import recovery

on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/book-admin-batch.yml']

permissions:
  contents: read
concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false

env:
  BOOK_BASELINE: b66979a745fec9879052aaf152ba3306e0fa98a0
  BOOK_TARGET: 46c28748fa661572b70f0cf32227ce34fdc0139f
  BOOK_TOOLS_REF: ${{ github.sha }}

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BOOK_TARGET }}
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: candidate/requirements.txt
      - name: Verify restorable checkout and the approved file list
        run: |
          bash scripts/test_book_phase_a_rollback.sh
          git -C candidate fetch --no-tags origin "$BOOK_BASELINE"
          git -C candidate diff --name-only "$BOOK_BASELINE" "$BOOK_TARGET" | cmp -s scripts/book_admin_web_scope.txt -
          test ! -e candidate/static/booking/calendar-mobile-sticky-day-header-v1.css

      - name: Verify focused integrated user acceptance scenarios
        working-directory: candidate
        run: |
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,testserver python manage.py test booking.test_simplybook_sync_integrity booking.test_simplybook_calendar_writeback booking.test_block_conflict_alerts booking.test_simplybook_notes_rate_limit booking.test_admin_notification_routing booking.test_mobile_staff_workspace booking.test_simplybook_outbound booking.test_app_admin_api --noinput

  release:
    needs: rehearse
    runs-on: ubuntu-24.04
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 15m
          envs: BOOK_BASELINE,BOOK_TARGET,BOOK_TOOLS_REF
          script: |
            set -euo pipefail
            app=/opt/aesthetic-book/app
            git -C "$app" fetch --no-tags origin "$BOOK_TOOLS_REF" "$BOOK_TARGET"
            tools="$(mktemp -d)"
            trap 'rm -rf -- "$tools"' EXIT
            for name in book_phase_a_release.sh book_admin_web_release.sh book_admin_web_scope.txt check_admin_web_schema.py book_phase_a_smoke.py; do
              git -C "$app" show "$BOOK_TOOLS_REF:scripts/$name" > "$tools/$name"
            done
            bash "$tools/book_admin_web_release.sh" "$BOOK_BASELINE" "$BOOK_TARGET"
