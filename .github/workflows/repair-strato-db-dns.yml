name: Repair STRATO restored DB and DNS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-strato-db-dns.yml"

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Repair database ownership and resolver permissions
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            chmod 0755 / /etc /run
            [ ! -d /run/systemd ] || chmod 0755 /run/systemd
            [ ! -d /run/systemd/resolve ] || chmod 0755 /run/systemd/resolve
            RESOLV="$(readlink -f /etc/resolv.conf || echo /etc/resolv.conf)"
            [ ! -f "$RESOLV" ] || chmod 0644 "$RESOLV"
            [ -L /etc/resolv.conf ] || chmod 0644 /etc/resolv.conf

            # Restore ownership only for application relations in public schema.
            # Avoid REASSIGN OWNED because postgres also owns required system objects.
            runuser -u postgres -- psql -v ON_ERROR_STOP=1 -d aestheticbook <<'SQL'
            ALTER DATABASE aestheticbook OWNER TO aestheticbook;
            ALTER SCHEMA public OWNER TO aestheticbook;

            SELECT format('ALTER TABLE %I.%I OWNER TO aestheticbook;', n.nspname, c.relname)
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind IN ('r','p') AND pg_get_userbyid(c.relowner) <> 'aestheticbook'
            \gexec

            SELECT format('ALTER SEQUENCE %I.%I OWNER TO aestheticbook;', n.nspname, c.relname)
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind='S' AND pg_get_userbyid(c.relowner) <> 'aestheticbook'
            \gexec

            SELECT format('ALTER VIEW %I.%I OWNER TO aestheticbook;', n.nspname, c.relname)
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind='v' AND pg_get_userbyid(c.relowner) <> 'aestheticbook'
            \gexec

            SELECT format('ALTER MATERIALIZED VIEW %I.%I OWNER TO aestheticbook;', n.nspname, c.relname)
            FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
            WHERE n.nspname='public' AND c.relkind='m' AND pg_get_userbyid(c.relowner) <> 'aestheticbook'
            \gexec

            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO aestheticbook;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO aestheticbook;
            GRANT ALL PRIVILEGES ON ALL FUNCTIONS IN SCHEMA public TO aestheticbook;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO aestheticbook;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO aestheticbook;
            SQL

            echo '=== application DB access ==='
            cd /opt/aesthetic-book/app
            runuser -u aestheticbook -- /bin/bash -c "set -a; source /etc/aesthetic-book.env; set +a; /opt/aesthetic-book/venv/bin/python manage.py showmigrations --plan >/dev/null; /opt/aesthetic-book/venv/bin/python manage.py shell -c \"from booking.models import Customer,Appointment; print('DB_ACCESS_OK customers=%d appointments=%d' % (Customer.objects.count(), Appointment.objects.count()))\""

            echo '=== service-user DNS ==='
            runuser -u aestheticbook -- /opt/aesthetic-book/venv/bin/python - <<'PY'
            import socket
            rows = socket.getaddrinfo('user-api.simplybook.me', 443, type=socket.SOCK_STREAM)
            if not rows:
                raise SystemExit('SimplyBook DNS returned no addresses')
            print('SIMPLYBOOK_DNS_OK=1')
            PY

            systemctl restart systemd-resolved 2>/dev/null || true
            echo 'RESTORED_DB_DNS_REPAIR=PASS'
