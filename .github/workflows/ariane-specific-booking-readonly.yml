name: Verify SimplyBook availability response structure without writes
on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/ariane-specific-booking-readonly.yml']
permissions:
  contents: read
concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            curl -fsS --max-time 15 https://book.a-esthetic.de/api/health/ -o /dev/null
            source /etc/aesthetic-simplybook-credentials.env
            runuser -u aestheticbook --preserve-environment -- /bin/bash -c 'set -a; source /etc/aesthetic-book.env; set +a; DJANGO_SETTINGS_MODULE=config.settings exec /opt/aesthetic-book/venv/bin/python -' <<'PY'
            import django
            import re
            django.setup()
            from booking.simplybook_outbound import session, source_slots, SyncConflict
            from booking.clinical_time import parse_clinic_wall_time
            call = session()
            day='2026-12-30'
            args=[day,day,8,2,1]
            for method in ('getStartTimeMatrix','getReservedTimeIntervals'):
                obj=call(method,args)
                rows=obj.get(day,[]) if isinstance(obj,dict) else []
                print(method+': root='+type(obj).__name__+', day='+type(rows).__name__+', count='+str(len(rows)))
                if method=='getReservedTimeIntervals' and isinstance(rows,list):
                    print('vendor_interval_types='+repr([(row.get('type'),type(row.get('intervals')).__name__,[list(i) if isinstance(i,dict) else type(i).__name__ for i in (row.get('intervals') or [])]) for row in rows if isinstance(row,dict) and re.fullmatch(r'[a-z_]{1,28}',str(row.get('type') or ''))]))
                    print('vendor_row_field_names='+repr([[k for k in row if re.fullmatch(r'[a-z_]{1,24}', k)] for row in rows if isinstance(row,dict)]))
                    print('reserved_rows_dict='+str(sum(isinstance(row,dict) for row in rows)))
                    print('reserved_rows_without_time='+str(sum(isinstance(row,dict) and 'reserved_time' not in row for row in rows)))
                    print('reserved_empty_time='+str(sum(isinstance(row,dict) and not row.get('reserved_time') for row in rows)))
                    if all(isinstance(row,dict) for row in rows):
                        intervals=[i for row in rows for i in row.get('reserved_time',[]) if isinstance(i,dict)]
                        print('reserved_midnight_end='+str(sum(i.get('to') in ('24:00','24:00:00') for i in intervals)))
                        print('reserved_zero_length='+str(sum(i.get('from')==i.get('to') for i in intervals)))
            try:
                source_slots(call,8,day,day)
            except SyncConflict as exc:
                reason=str(exc)
                if reason in ('missing_credentials','empty_token','unexpected_availability_shape','unexpected_reserved_shape','unexpected_source_slot'):
                    print('SIMPLYBOOK_REJECTED_SHAPE='+reason)
            PY
