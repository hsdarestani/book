name: Check the preserved SimplyBook source collision
on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/ariane-specific-booking-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            file=booking/simplybook_writeback.py
            test -f "$file"
            test ! -L "$file"
            git ls-files --error-unmatch "$file" >/dev/null 2>&1 && exit 2
            printf 'KNOWN_BOOK_SOURCE_REVISION=%s\n' "$(git rev-parse HEAD)"
            printf 'SIMPLYBOOK_SOURCE_BLOB=%s\n' "$(git hash-object "$file")"
