name: Activate and verify read-only SimplyBook availability
on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/ariane-specific-booking-readonly.yml']
permissions:
  contents: read
concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            umask 077
            cd /opt/aesthetic-book/app
            test "$(git rev-parse HEAD)" = ee931357afe243ad9dbf3e8d2c53845a958ffeff
            base=/opt/aesthetic-book/remediation-rollbacks
            exec 9>"$base/release.lock"
            flock -n 9
            test -r /etc/aesthetic-simplybook-credentials.env
            config=/etc/systemd/system/aesthetic-book.service.d/55-simplybook-availability.conf
            candidate=$(mktemp)
            changed=0
            cleanup() {
              rc=$?
              trap - EXIT
              if [ "$rc" != 0 ] && [ "$changed" = 1 ]; then
                rm -f "$config"
                systemctl daemon-reload
                systemctl restart aesthetic-book
                curl -fsS --retry 6 --retry-connrefused --retry-delay 2 --max-time 20 https://book.a-esthetic.de/api/health/ -o /dev/null
                echo 'SIMPLYBOOK_AVAILABILITY_ROLLED_BACK=true'
              fi
              rm -f "$candidate"
              exit "$rc"
            }
            trap cleanup EXIT
            printf '%s\n' '[Service]' 'LoadCredential=simplybook:/etc/aesthetic-simplybook-credentials.env' 'Environment=SIMPLYBOOK_AVAILABILITY_ENABLED=1' > "$candidate"
            if [ -e "$config" ]; then
              cmp -s "$config" "$candidate"
            else
              install -d -m 0755 "$(dirname "$config")"
              install -m 0644 "$candidate" "$config"
              changed=1
            fi
            systemctl daemon-reload
            systemctl restart aesthetic-book
            curl -fsS --retry 6 --retry-connrefused --retry-delay 2 --max-time 15 https://book.a-esthetic.de/api/health/ -o /dev/null
            pid=$(systemctl show aesthetic-book -p MainPID --value)
            tr '\0' '\n' < "/proc/$pid/environ" | grep -Fx 'SIMPLYBOOK_AVAILABILITY_ENABLED=1' >/dev/null
            if tr '\0' '\n' < "/proc/$pid/environ" | grep -Eq '^(SIMPLYBOOK_OUTBOUND_ENABLED=1|SIMPLYBOOK_ADMIN_WRITEBACK_ENABLED=true)$'; then exit 2; fi
            source /etc/aesthetic-simplybook-credentials.env
            runuser -u aestheticbook --preserve-environment -- /bin/bash -c 'set -a; source /etc/aesthetic-book.env; set +a; DJANGO_SETTINGS_MODULE=config.settings exec /opt/aesthetic-book/venv/bin/python -' <<'PY'
            import json
            import logging
            from datetime import date
            from urllib.request import urlopen
            import django
            logging.disable(logging.CRITICAL)
            django.setup()
            from booking.clinical_time import parse_appointment_start
            from booking.models import Service, StaffMember
            from booking.simplybook_outbound import ARIANE, SERVICE_MAP, session, source_slots, SyncConflict
            try:
                day = date(2026,12,30).isoformat()
                staff = StaffMember.objects.get(display_name=ARIANE)
                slug = 'aesthetische-erstberatung'
                service = Service.objects.get(slug=slug)
                matrix, _ = source_slots(session(), SERVICE_MAP[slug][0], day, day)
                vendor = set(matrix.get(day, ()))
                root = 'https://book.a-esthetic.de'
                params = f'service_id={service.pk}&staff_id={staff.pk}'
                for endpoint, field in [('/api/availability/', 'date'),('/api/mobile/slots/', 'day')]:
                    with urlopen(f'{root}{endpoint}?{params}&{field}={day}', timeout=50) as result:
                        payload=json.load(result)
                    returned={parse_appointment_start(row['starts_at'] if isinstance(row,dict) else row) for row in payload['slots']}
                    if not payload['ok'] or not returned or not returned <= vendor:
                        raise ValueError('unexpected_slot_contract')
                print('ARIANE_PUBLIC_AND_MOBILE_MATCH_SOURCE=true')
                print('SIMPLYBOOK_READ_ONLY_ACTIVE=true')
            except Exception as exc:
                message = str(exc) if isinstance(exc, SyncConflict) and str(exc) in {'missing_credentials','unexpected_availability_shape','unexpected_reserved_shape','unexpected_source_slot'} else type(exc).__name__
                print('SIMPLYBOOK_SOURCE_VERIFICATION_FAILED=' + message)
                raise SystemExit(2)
            PY
