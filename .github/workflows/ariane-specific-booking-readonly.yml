name: Read-only inventory of the authorized synthetic test slot
on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/ariane-specific-booking-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            test -r /etc/aesthetic-simplybook-credentials.env
            source /etc/aesthetic-simplybook-credentials.env
            cd /opt/aesthetic-book/app
            runuser -u aestheticbook --preserve-environment -- bash -c 'set -ae; source /etc/aesthetic-book.env; cd /opt/aesthetic-book/app; exec /opt/aesthetic-book/venv/bin/python manage.py shell' <<'PY'

            from django.db.models import Count
            from booking.models import Appointment
            from booking.clinical_time import parse_clinic_wall_time
            times = [parse_clinic_wall_time('2026-12-30', time) for time in ('16:15','16:00')]
            base=Appointment.objects.filter(staff__display_name='Frau Ariane Regaei',
                service__slug='aesthetische-erstberatung', source='app')
            for index, stamp in enumerate(times):
                subset = base.filter(starts_at=stamp)
                print('SLOT_GROUP_'+str(index)+'_TOTAL='+str(subset.count()))
                for marker in ('confirmed','new','cancelled','completed','no_show'):
                    print('SLOT_GROUP_'+str(index)+'_'+marker.upper()+'='+str(subset.filter(status=marker).count()))
                print('SLOT_GROUP_'+str(index)+'_REVIEW='+str(subset.filter(simplybook_sync_state='review').count()))
                print('SLOT_GROUP_'+str(index)+'_LINKED='+str(subset.filter(simplybook_booking_id__isnull=False).count()))
            print('ALTERNATIVE_UNIQUE_REVIEW_WITH_KNOWN_CLIENT='+str(base.filter(starts_at=times[1],simplybook_sync_state='review')
                .exclude(simplybook_client_id='').count()))
            PY
