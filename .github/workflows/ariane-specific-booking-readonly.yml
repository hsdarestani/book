name: Read-only Ariane specific booking reconciliation preflight
on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/ariane-specific-booking-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            test -r /etc/aesthetic-simplybook-credentials.env
            source /etc/aesthetic-simplybook-credentials.env
            cd /opt/aesthetic-book/app
            runuser -u aestheticbook --preserve-environment -- bash -c 'set -ae; source /etc/aesthetic-book.env; cd /opt/aesthetic-book/app; exec /opt/aesthetic-book/venv/bin/python manage.py shell' <<'PY'

            import logging
            from booking import simplybook_outbound as sync
            from booking.models import Appointment
            from booking.clinical_time import parse_clinic_wall_time
            logging.disable(logging.CRITICAL)
            day = '2026-12-30'
            old, new = [parse_clinic_wall_time(day, time) for time in ('16:15','16:00')]
            entries = list(Appointment.objects.select_related('staff','service','customer').filter(
                staff__display_name=sync.ARIANE, service__slug='aesthetische-erstberatung',
                starts_at__in=[old,new], source='app', status__in=['new','confirmed'])[:3])
            stage = 'candidate'
            allowed = {'unsupported_appointment','missing_credentials','empty_token','ambiguous_client_identity',
                'linked_client_not_verified','source_client_readback_failed','source_client_link_mismatch',
                'source_slot_unavailable','source_reserved_interval_conflict','source_booking_conflict',
                'unexpected_reserved_shape','unexpected_bookings_shape','duplicate_source_bookings',
                'unexpected_timezone','unexpected_provider_catalog','source_service_mismatch'}
            try:
                print('CANDIDATES=' + str(len(entries)))
                if len(entries) == 1:
                    item = entries[0]
                    print('AT_AUTHORIZED_TIME=' + str(item.starts_at == new).lower())
                    marker = item.simplybook_sync_state
                    print('LOCAL_MARKER=' + (marker if marker in {'sending','review','linked','queued'} else 'other' if marker else 'unattempted'))
                    print('SOURCE_ID_PRESENT=' + str(bool(item.simplybook_booking_id)).lower())
                    print('SOURCE_CLIENT_ID_PRESENT=' + str(bool(item.simplybook_client_id)).lower())
                    stage = 'session'
                    call = sync.session()
                    stage = 'catalog'
                    event = sync._verify_catalog(call,item)
                    stage = 'client'
                    client = sync._get_client(call,item.customer,apply=False)
                    stage = 'booking_list'
                    found = call('getBookings',[{'date_from':day,'date_to':day,'booking_type':'non_cancelled'}])
                    exact = [row for row in found if client and sync._same_booking(row,item,event,client)]
                    print('EXACT_CONFIRMED_SOURCE_MATCHES=' + str(len(exact)))
                    if item.simplybook_booking_id and len(exact) == 1:
                        stage = 'readback'
                        sync._verify_readback(call,int(item.simplybook_booking_id),item,event,client)
                        print('SOURCE_ID_VERIFIED=true')
                    elif marker == 'review' and item.simplybook_client_id:
                        print('READ_ONLY_RECONCILIATION=' + sync.reconcile_existing(item.pk,call=call)['result'])
                    else:
                        from copy import copy
                        from booking.clinical_time import add_elapsed
                        target = copy(item)
                        target.starts_at = new
                        target.ends_at = add_elapsed(new,item.reserved_duration)
                        stage = 'target_availability'
                        previous = sync._verify_availability(call,target,event,client)
                        print('TARGET_AVAILABLE_OR_LINKABLE=true')
                print('PROBE_COMPLETE=true')
            except Exception as exc:
                reason = str(exc) if isinstance(exc,sync.SyncConflict) and str(exc) in allowed else type(exc).__name__
                print('STOP_STAGE=' + stage + ' CATEGORY=' + reason)
            PY
