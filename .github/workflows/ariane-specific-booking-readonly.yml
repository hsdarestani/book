name: Read-only Ariane specific booking reconciliation preflight
on:
  push:
    branches: [release/admin-batch-runner-20261126]
    paths: ['.github/workflows/ariane-specific-booking-readonly.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            test -r /etc/aesthetic-simplybook-credentials.env
            source /etc/aesthetic-simplybook-credentials.env
            cd /opt/aesthetic-book/app
            runuser -u aestheticbook --preserve-environment -- bash -c 'set -ae; source /etc/aesthetic-book.env; cd /opt/aesthetic-book/app; exec /opt/aesthetic-book/venv/bin/python manage.py shell' <<'PY'
            import logging
            from booking.models import Appointment
            from booking.clinical_time import parse_clinic_wall_time
            from booking.simplybook_outbound import session, _verify_catalog, _get_client, _verify_availability, _additional_answers, SyncConflict, SERVICE_MAP
            logging.disable(logging.CRITICAL)
            start = parse_clinic_wall_time('2026-12-30','16:15')
            candidates = list(Appointment.objects.select_related('staff','service','customer').filter(staff__display_name='Frau Ariane Regaei',service__slug='aesthetische-erstberatung',starts_at=start,source='app',status__in=['new','confirmed'])[:2])
            print('EXACT_LOCAL_MATCH_COUNT=' + str(len(candidates)))
            if len(candidates) != 1: raise SystemExit(0)
            item = candidates[0]
            state = item.simplybook_sync_state
            print('SYNC_STATE=' + (state if state in {'sending','review','linked'} else 'unattempted' if not state else 'other'))
            print('LOCAL_REMOTE_ID_PRESENT=' + str(bool(item.simplybook_booking_id)).lower())
            print('MAPPING_PRESENT=' + str(item.service.slug in SERVICE_MAP).lower())
            print('LOCAL_REFERRAL_ANSWER_PRESENT=' + str(bool(item.referral_source)).lower())
            print('LOCAL_RETURNING_POSITIVE_PRESENT=' + str(bool(item.returning_customer)).lower())
            allowed={'unsupported_appointment','already_source_managed','unmapped_service','unexpected_timezone','unexpected_provider_catalog','source_service_mismatch','missing_credentials','empty_token','ambiguous_client_identity','linked_client_not_verified','source_client_readback_failed','source_client_link_owned_by_other','source_additional_answer_required','source_additional_choice_changed','unexpected_additional_field','unexpected_additional_fields_shape','unexpected_bookings_shape','source_slot_unavailable','source_reserved_interval_conflict','unexpected_reserved_shape','duplicate_source_bookings'}
            def category(error):
                return str(error) if isinstance(error, SyncConflict) and str(error) in allowed else 'source_unavailable_or_unexpected'
            try:
                call=session()
                event=_verify_catalog(call,item)
                print('REMOTE_CATALOG=verified')
            except Exception as exc:
                print('REMOTE_CATALOG='+category(exc)); raise SystemExit(0)
            try:
                client=_get_client(call,item.customer,apply=False)
                previous=_verify_availability(call,item,event,client)
                print('REMOTE_EXACT_BOOKING_FOUND='+str(bool(previous)).lower())
                print('REMOTE_AVAILABILITY=verified')
            except Exception as exc:
                print('REMOTE_RECONCILIATION='+category(exc))
            # Only report fixed diagnostic categories, never raw remote objects.
            try:
                day='2026-12-30'
                matrix=call('getStartTimeMatrix',[day,day,event,2,1])
                times=matrix.get(day) if isinstance(matrix,dict) else None
                print('MATRIX_DAY_PRESENT='+str(isinstance(times,list)).lower())
                print('MATRIX_TIME_STRING='+str(isinstance(times,list) and all(isinstance(t,str) for t in times)).lower())
                print('MATRIX_1615_PRESENT='+str(isinstance(times,list) and any(str(t)[:5]=='16:15' for t in times)).lower())
                print('NEARBY_AVAILABLE='+','.join(t for t in ('15:30','15:45','16:00','16:15','16:30','16:45') if isinstance(times,list) and any(str(v)[:5]==t for v in times)))
                reserved=call('getReservedTimeIntervals',[day,day,event,2,1])
                print('RESERVATION_DATA_VALID='+str(isinstance(reserved,dict)).lower())
                fields=call('getAdditionalFields',[event])
                from booking.customer_identity import normalize_name
                from booking.management.commands.simplybook_import import as_bool
                for key,title in [('RETURNING','warst du schon einmal bei uns?'),('REFERRAL','wie bist du auf uns aufmerksam geworden?')]:
                    found=[f for f in fields if normalize_name(f.get('title'))==title] if isinstance(fields,list) else []
                    print(key+'_FIELD_PRESENT='+str(bool(found)).lower())
                    print(key+'_REQUIRED_FLAG='+str(any(as_bool(f.get(k)) for f in found for k in ('required','is_required','mandatory','is_mandatory'))).lower())
            except Exception:
                print('EXTRA_PREFLIGHT=unavailable')
            try:
                _additional_answers(call,item,event)
                print('MANDATORY_ANSWERS=verified')
            except Exception as exc:
                print('MANDATORY_ANSWERS='+category(exc))
            from booking.services import available_slots
            from booking.clinical_time import add_elapsed
            alternative=parse_clinic_wall_time('2026-12-30','16:00')
            duration=item.reserved_duration
            local_ok=alternative in available_slots(item.service,item.staff,alternative.astimezone(__import__('booking.clinical_time',fromlist=['CLINIC_TZ']).CLINIC_TZ).date(),exclude_appointment_id=item.public_id,reserved_duration=duration)
            print('ALTERNATIVE_LOCAL_AVAILABLE='+str(local_ok).lower())
            item.starts_at=alternative
            item.ends_at=add_elapsed(alternative,duration)
            try:
                client=_get_client(call,item.customer,apply=False)
                existing=_verify_availability(call,item,event,client)
                print('ALTERNATIVE_REMOTE_AVAILABLE='+str(not bool(existing)).lower())
                print('ALTERNATIVE_ALREADY_LINKABLE='+str(bool(existing)).lower())
            except Exception as exc:
                print('ALTERNATIVE_REMOTE_CONFLICT='+category(exc))
            print('SOURCE_WRITES=none')
            PY
