name: Verify homepage hero manager in Book admin
on:
  pull_request:
    paths:
      - 'booking/app_management_views.py'
      - 'booking/test_home_hero_admin.py'
      - 'templates/booking/app_management.html'
      - '.github/workflows/verify-home-hero-admin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Check admin forms and upload
        env:
          DJANGO_DEBUG: '1'
        run: |
          python -m compileall -q booking/app_management_views.py booking/test_home_hero_admin.py
          python manage.py check
          python manage.py test booking.test_home_hero_admin --verbosity 2
