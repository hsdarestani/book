name: Temporary SimplyBook post-repair verification
on:
  push:
    branches: [audit/esthetic-simplybook-production-repair-20261022]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Compare all source bookings and client associations (read only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            TARGET=e20a98567051e73b9146761a41e9e0a1261a2615
            APP=/opt/aesthetic-book/app
            for attempt in $(seq 1 120); do
              if [ "$(git -C "$APP" rev-parse HEAD 2>/dev/null || true)" = "$TARGET" ]; then break; fi
              sleep 10
            done
            test "$(git -C "$APP" rev-parse HEAD)" = "$TARGET"
            source /etc/aesthetic-simplybook-credentials.env
            export SIMPLYBOOK_COMPANY_LOGIN SIMPLYBOOK_USER_LOGIN SIMPLYBOOK_USER_PASSWORD SIMPLYBOOK_API_USER_KEY
            flock -w 1200 /var/lock/aesthetic-simplybook-sync.lock runuser -u aestheticbook --preserve-environment -- bash -c 'set -a; source /etc/aesthetic-book.env; set +a; cd /opt/aesthetic-book/app; /opt/aesthetic-book/venv/bin/python manage.py sync_simplybook_continuous'
            VERIFY_CODE="$(cat <<'PY'
            import json, os
            from booking.models import Customer, Appointment, SimplyBookClientLink, ExternalSyncState
            from booking.customer_identity import normalize_phone, normalize_email, duplicate_customer_groups
            from booking.management.commands.cleanup_simplybook_orphans import candidate_groups
            from booking.management.commands.simplybook_import import rpc,LOGIN_URL,ADMIN_URL
            company=os.environ.get("SIMPLYBOOK_COMPANY_LOGIN")
            user=os.environ.get("SIMPLYBOOK_USER_LOGIN")
            key=os.environ.get("SIMPLYBOOK_API_USER_KEY") or os.environ.get("SIMPLYBOOK_USER_PASSWORD")
            token=rpc(LOGIN_URL,"getUserToken",[company,user,key],timeout=30)
            headers={"X-Company-Login":company,"X-User-Token":token}
            clients=rpc(ADMIN_URL,"getClientList",["",None],headers=headers,timeout=90) or []
            bookings=rpc(ADMIN_URL,"getBookings",[{"date_from":"2000-01-01","date_to":"2035-12-31","booking_type":"all","order":"date_start_asc"}],headers=headers,timeout=90) or []
            links=dict(SimplyBookClientLink.objects.values_list("external_client_id","customer_id"))
            appts=dict(Appointment.objects.filter(idempotency_key__startswith="simplybook-").values_list("idempotency_key","customer_id"))
            by_id={str(x.get("id")):x for x in bookings if isinstance(x,dict) and x.get("id") is not None}
            customer_rows=list(Customer.objects.all().only("pk","first_name","last_name","phone","email"))
            anonymous=[x for x in customer_rows if x.first_name=="SimplyBook" and x.last_name=="Kunde" and not x.phone and x.email.startswith("simplybook-booking-") and x.email.endswith("@invalid.local")]
            actual=[x for x in customer_rows if x not in anonymous]
            mismatch=0
            missing_appointment=0
            missing_client_link=0
            for item in bookings:
             bid="simplybook-"+str(item.get("id") or "")
             cid=str(item.get("client_id") or "")
             if bid not in appts:
              missing_appointment+=1
             elif cid and cid in links and links[cid]!=appts[bid]:
              mismatch+=1
             if cid and cid not in links:missing_client_link+=1
            state=ExternalSyncState.objects.filter(source="simplybook").first()
            summary={"source_client_ids":len(clients),"linked_client_ids":len(links),"source_bookings":len(bookings),"synced_local_bookings":len(appts),"source_bookings_missing_local":missing_appointment,"source_booking_wrong_customer_link":mismatch,"missing_source_client_links":missing_client_link,"customer_rows":len(customer_rows),"identifiable_profile_rows":len(actual),"distinct_normalized_phones":len({normalize_phone(x.phone) for x in actual if normalize_phone(x.phone)}),"distinct_real_emails":len({normalize_email(x.email) for x in actual if normalize_email(x.email)}),"contact_groups":len(duplicate_customer_groups(actual)),"retained_anonymous_profiles":len(anonymous),"remaining_orphan_candidates":sum(max(0,len(g)-1) for g in candidate_groups().values()),"last_successful_sync_recorded":bool(state and state.last_success_at)}
            source_clients={str(item.get("id")):item for item in clients if isinstance(item,dict)}
            snapshot_records={
              row["external_client_id"]:row
              for row in SimplyBookClientLink.objects.values(
                "external_client_id","source_name","source_email","source_phone"
              )
            }
            source_profile_mismatches=0
            for cid,record in source_clients.items():
              snap=snapshot_records.get(cid)
              if not snap or (
                snap["source_name"] != str(record.get("name") or "").strip()[:160]
                or snap["source_email"] != str(record.get("email") or "").strip().lower()[:254]
                or snap["source_phone"] != str(record.get("phone") or "").strip()[:40]
              ):
                source_profile_mismatches+=1
            summary["source_contact_snapshots_mismatched"]=source_profile_mismatches
            summary["distinct_source_phone_snapshots"]=len({
              normalize_phone(row["source_phone"])
              for row in snapshot_records.values() if normalize_phone(row["source_phone"])
            })
            print("SIMPLYBOOK_FINAL_VERIFICATION="+json.dumps(summary,sort_keys=True))
            if summary["source_bookings_missing_local"] or summary["source_booking_wrong_customer_link"] or summary["missing_source_client_links"] or summary["remaining_orphan_candidates"] or summary["source_contact_snapshots_mismatched"]:
             raise SystemExit("Integrity verification failed")
            
            PY
            )"
            export VERIFY_CODE
            runuser -u aestheticbook --preserve-environment -- bash -c 'set -a; source /etc/aesthetic-book.env; set +a; cd /opt/aesthetic-book/app; /opt/aesthetic-book/venv/bin/python manage.py shell -c "$VERIFY_CODE"'
