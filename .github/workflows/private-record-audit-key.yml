name: Prepare private audit input envelope
on:
  push:
    branches: [qa/private-existing-record-diagnostics-20261127]
    paths: ['.github/workflows/private-record-audit-key.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare a single-use audit transport key (no record access)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -euo pipefail
            umask 077
            directory=/run/aesthetic-record-audit-20261127-7f6291
            mkdir -m 700 "$directory"
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$directory/input.key" >/dev/null 2>&1
            printf 'AUDIT_INPUT_PUBLIC='
            openssl pkey -in "$directory/input.key" -pubout | base64 -w0
            printf '\n'
