name: Verify clinician-only access

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor-security:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q booking
      - run: python manage.py check
      - run: python manage.py migrate --noinput
      - run: python manage.py test booking.test_doctor_read_only booking.test_app_admin_sso booking.test_app_admin_api --verbosity 2
