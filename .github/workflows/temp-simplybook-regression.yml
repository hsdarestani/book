name: Temporary SimplyBook regression tests
on:
  push:
    branches: [fix/simplybook-real-identity-safe-cleanup-20261022]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate models and run regression suite
        env:
          DJANGO_DEBUG: '1'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test booking.test_simplybook_sync_integrity booking.test_simplybook_synthetic_identity booking.test_duplicate_patient_safety booking.test_fast_calendar_and_login
