name: Validate SimplyBook blocking-conflict admin alerts
on:
  push:
    branches: [feat/simplybook-block-booking-conflict-alerts-20261105]
    paths: ['booking/**', '.github/workflows/validate-block-conflict-alerts-20261105.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check schema and conflict alert tests
        env:
          DJANGO_DEBUG: '1'
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py test booking.test_block_conflict_alerts booking.test_simplybook_notes_rate_limit booking.test_simplybook_sync_integrity booking.test_admin_notification_routing
      - name: Full regression suite
        env:
          DJANGO_DEBUG: '1'
        run: python manage.py test
