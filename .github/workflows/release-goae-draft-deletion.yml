name: Release GOÄ draft deletion in Book

on:
  push:
    branches: [release/goae-draft-deletion]

permissions:
  contents: read

concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.txt
          python manage.py check
          python manage.py test booking.test_same_domain_invoices booking.test_goae_assistant --noinput
      - uses: appleboy/ssh-action@v1.2.0
        env:
          BOOK_TARGET: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 6m
          envs: BOOK_TARGET
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            exec 9>/opt/aesthetic-book/remediation-rollbacks/release.lock
            flock -n 9
            base=7c470d7017ba0b6cbd69fb198e0fbd6cf161609c
            test "$(git rev-parse HEAD)" = "$base"
            test -z "$(git status --porcelain --untracked-files=no)"
            git fetch -q --no-tags origin "$BOOK_TARGET"
            test "$(git rev-parse "$BOOK_TARGET^")" = "$base"
            scope="$(printf '%s\n' .github/workflows/release-goae-draft-deletion.yml booking/app_management_views.py booking/invoice_bridge.py booking/test_same_domain_invoices.py templates/booking/app_management.html | sort)"
            test "$(git diff --name-only "$base" "$BOOK_TARGET" | sort)" = "$scope"
            systemctl is-active --quiet aesthetic-book
            switched=0
            finish() {
              result=$?
              trap - EXIT
              if (( result != 0 && switched )); then
                git switch -q --no-overwrite-ignore --detach "$base" && systemctl restart aesthetic-book || result=2
                echo "GOAE_DRAFT_WEB_ROLLBACK=$result"
              fi
              exit "$result"
            }
            trap finish EXIT
            django() {
              runuser -u aestheticbook -- bash -c '
                set -ae
                source /etc/aesthetic-book.env
                exec /opt/aesthetic-book/venv/bin/python manage.py "$@"
              ' bash "$@"
            }
            django shell -c 'from urllib.error import HTTPError; from urllib.request import Request, urlopen; from booking.invoice_bridge import BRIDGE_ROOT; from booking.internal_api import _sync_token
            try:
                urlopen(Request(BRIDGE_ROOT + "delete-draft/1/", headers={"X-Aesthetic-Patient-Sync": _sync_token()}), timeout=12).close()
            except HTTPError as error:
                assert error.code == 405 and error.headers.get("Allow") == "POST"
            else:
                raise AssertionError("Expected a verified POST-only billing endpoint.")'
            git switch -q --no-overwrite-ignore --detach "$BOOK_TARGET"
            switched=1
            django check
            systemctl restart aesthetic-book
            for attempt in {1..12}; do
              if systemctl is-active --quiet aesthetic-book && curl -fsS --max-time 8 https://book.a-esthetic.de/api/health/ -o /dev/null; then break; fi
              sleep 2
            done
            systemctl is-active --quiet aesthetic-book
            systemctl is-active --quiet aesthetic-simplybook-sync.timer
            curl -fsS --max-time 8 https://book.a-esthetic.de/api/health/ -o /dev/null
            echo "GOAE_DRAFT_WEB_VERIFIED=$BOOK_TARGET"
