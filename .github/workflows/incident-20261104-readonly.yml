name: Incident 2026-11-04 read-only appointment and notification audit
on:
  push:
    branches:
      - investigate/booking-20261104-ariane
    paths:
      - ".github/workflows/incident-20261104-readonly.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Inspect production metadata only (no writes or personal identifiers)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "INCIDENT_AUDIT_START"
            cd /opt/aesthetic-book/app
            set -a
            source /etc/aesthetic-book.env
            set +a
            runuser -u aestheticbook --preserve-environment -- /opt/aesthetic-book/venv/bin/python manage.py shell <<'PY'
            from datetime import datetime,timedelta
            from zoneinfo import ZoneInfo
            from django.utils import timezone
            from django.conf import settings
            from booking.models import Appointment,BlockedPeriod,StaffMember,DailyAvailabilityOverride,ExternalSyncState
            tz=ZoneInfo("Europe/Berlin")
            start=datetime(2026,11,4,0,0,tzinfo=tz)
            end=start+timedelta(days=1)
            print("BOOKING_ADMIN_MAIL_CONFIGURED",bool(settings.BOOKING_NOTIFICATION_EMAIL))
            qs=Appointment.objects.select_related("staff","service").filter(starts_at__gte=start,starts_at__lt=end,staff__display_name__icontains="ariane",service__name__icontains="hyaluron").order_by("starts_at","created_at")
            print("MATCHING_BOOKINGS",qs.count())
            for a in qs:
                print("BOOKING", "slot",timezone.localtime(a.starts_at,tz).strftime("%Y-%m-%d %H:%M"),"created",timezone.localtime(a.created_at,tz).isoformat(),"updated",timezone.localtime(a.updated_at,tz).isoformat(),"source",a.source,"status",a.status,"imported",str(a.idempotency_key or "").startswith("simplybook-"),"staff",a.staff.display_name,"service",a.service.name)
            staff=StaffMember.objects.filter(display_name__icontains="ariane")
            for s in staff:
                blocks=BlockedPeriod.objects.filter(staff=s,starts_at__lt=end,ends_at__gt=start).order_by("starts_at")
                print("STAFF_MATCHED",s.pk,"BLOCK_COUNT",blocks.count())
                for b in blocks:
                    print("BLOCK","start",timezone.localtime(b.starts_at,tz).isoformat(),"end",timezone.localtime(b.ends_at,tz).isoformat(),"kind",("note" if b.reason.startswith("[NOTE]") else "blocked"),"from_simplybook",("##SB:" in b.reason or "SIMPLYBOOK" in b.reason),"label_gesperrt",("gesperrt" in b.reason.lower()),"prefix",(b.reason or "")[:24].split(" ")[0])
                o=DailyAvailabilityOverride.objects.filter(staff=s,date=start.date()).first()
                if o:
                    print("DAY_OVERRIDE","closed",o.closed,"first",str(o.start_time_1),str(o.end_time_1),"second",str(o.start_time_2),str(o.end_time_2))
                else:
                    print("DAY_OVERRIDE","none")
            st=ExternalSyncState.objects.filter(source="simplybook").first()
            if st: print("SYNC_STATE","last_success",str(st.last_success_at),"last_notes_status",str(st.metadata.get("last_notes_status")),"last_notes_success",str(st.metadata.get("last_notes_success_at")))
            PY
            echo "=== SYNC_TIMER ==="
            systemctl is-active aesthetic-simplybook-sync.timer || true
            systemctl show aesthetic-simplybook-sync.service -p ActiveState -p Result -p ExecMainStatus --no-pager || true
            echo "=== APP_PUSH_AUDIT ==="
            if test -x /opt/a-esthetic-mobile/venv/bin/python && test -f /opt/a-esthetic-mobile/mobile.env; then
              cd /opt/a-esthetic-mobile
              set -a
              source /opt/a-esthetic-mobile/mobile.env
              set +a
              /opt/a-esthetic-mobile/venv/bin/python manage.py shell <<'PY'
            from datetime import datetime,timedelta
            from zoneinfo import ZoneInfo
            from django.utils import timezone
            from django.utils.dateparse import parse_datetime
            from p0_app.ops_models import AppNotification,PushDevice
            tz=ZoneInfo("Europe/Berlin")
            start=datetime(2026,10,23,0,0,tzinfo=tz)
            q=AppNotification.objects.filter(category="booking",created_at__gte=start,created_at__lte=timezone.now()).order_by("-created_at")
            matches=[]
            for n in q.iterator():
                data=n.data or {}
                if data.get("booking_event") != "booking_created": continue
                v=parse_datetime(str(data.get("booking_starts_at") or ""))
                if not v or timezone.is_naive(v): continue
                if timezone.localtime(v,tz).strftime("%Y-%m-%d %H:%M")!="2026-11-04 19:00": continue
                if n.title!="Neue Buchung": continue
                matches.append(n)
            print("ADMIN_PUSH_EVENT_MATCHES",len(matches))
            for n in matches:
                result=n.push_result or {}
                devices=result.get("devices",[])
                print("ADMIN_PUSH_EVENT","created",timezone.localtime(n.created_at,tz).isoformat(),"attempted",timezone.localtime(n.push_attempted_at,tz).isoformat() if n.push_attempted_at else "not_attempted","device_attempts",len(devices),"accepted",sum(1 for x in devices if x.get("ok")),"failures",sum(1 for x in devices if not x.get("ok")),"android_configured",bool((result.get("configured") or {}).get("android")),"ios_configured",bool((result.get("configured") or {}).get("ios")),"error_types",[str(x.get("error") or "")[:90].split(":")[0] for x in devices if not x.get("ok")])
            PY
            else
              echo "APP_DB_NOT_COLOCATED_WITH_BOOK"
            fi

            echo "=== SOURCE_NOTE_METADATA_AUDIT ==="
            if test -r /etc/aesthetic-simplybook-credentials.env; then
              set -a
              source /etc/aesthetic-simplybook-credentials.env
              set +a
              cd /opt/aesthetic-book/app
              runuser -u aestheticbook --preserve-environment -- /opt/aesthetic-book/venv/bin/python manage.py shell <<'PY'
            import os,urllib.parse
            from booking.management.commands.sync_simplybook_notes import _request_json,_items_from_page,_total_pages,AUTH_URL,NOTES_URL
            company=(os.environ.get("SIMPLYBOOK_COMPANY_LOGIN") or "").strip()
            login=(os.environ.get("SIMPLYBOOK_USER_LOGIN") or "").strip()
            pw=(os.environ.get("SIMPLYBOOK_USER_PASSWORD") or "").strip()
            a=_request_json(AUTH_URL,method="POST",payload={"company":company,"login":login,"password":pw})
            token=str(a.get("token") or "").strip()
            if not token: raise RuntimeError("SimplyBook notes auth failed")
            headers={"X-Company-Login":company,"X-Token":token}
            matches=[]
            total=0
            for page in range(1,30):
                query=urllib.parse.urlencode([("page",page),("on_page",100),("filter[date_from]","2000-01-01"),("filter[date_to]","2035-12-31")])
                data=_request_json(NOTES_URL+"?"+query,headers=headers)
                items=_items_from_page(data)
                total+=len(items)
                for row in items:
                    if not isinstance(row,dict): continue
                    start=str(row.get("start_date_time") or row.get("from") or "")
                    end=str(row.get("end_date_time") or row.get("to") or "")
                    if start.startswith("2026-11-04 16:00") and end.startswith("2026-11-04 20:00"):
                        matches.append(row)
                pages=_total_pages(data)
                if len(items)<100 or (pages and page>=pages): break
            print("SOURCE_NOTES_SCANNED",total,"SLOT_MATCHES",len(matches))
            for m in matches:
                print("SOURCE_NOTE","blocked",repr(m.get("time_blocked")),"keys",sorted(m.keys()),"create_fields",[(k,str(m.get(k))[:80]) for k in m if any(t in k.lower() for t in ("creat","modif","updat","insert","record_date","timestamp"))])
            PY
            else
              echo "SOURCE_NOTE_CREDENTIALS_UNAVAILABLE"
            fi

            echo "=== DATABASE_ROW_CHRONOLOGY ==="
            cd /opt/aesthetic-book/app
            set -a; source /etc/aesthetic-book.env; set +a
            runuser -u aestheticbook --preserve-environment -- /opt/aesthetic-book/venv/bin/python manage.py shell <<'PY'
            from datetime import datetime,timedelta
            from zoneinfo import ZoneInfo
            from django.db import connection
            from booking.models import BlockedPeriod,Appointment
            tz=ZoneInfo("Europe/Berlin")
            day_start=datetime(2026,11,4,0,0,tzinfo=tz)
            a=Appointment.objects.filter(starts_at__gte=day_start,starts_at__lt=day_start+timedelta(days=1),staff__display_name__icontains="ariane",service__name__icontains="hyaluron").first()
            b=BlockedPeriod.objects.filter(starts_at__lte=day_start+timedelta(hours=19),ends_at__gt=day_start+timedelta(hours=19),staff__display_name__icontains="ariane").first()
            print("DATABASE_VENDOR",connection.vendor)
            if connection.vendor=="postgresql" and a and b:
                with connection.cursor() as c:
                    c.execute("select current_setting('track_commit_timestamp',true)")
                    flag=c.fetchone()[0]
                    c.execute("select xmin::text from booking_appointment where id=%s",[a.pk]); ax=c.fetchone()[0]
                    c.execute("select xmin::text from booking_blockedperiod where id=%s",[b.pk]); bx=c.fetchone()[0]
                    print("ROW_ORDER","booking_xid",ax,"block_xid",bx,"block_current_row_version_after_booking",int(bx)>int(ax),"commit_tracking",flag)
                    if flag=="on":
                        c.execute("select pg_xact_commit_timestamp(xmin) from booking_appointment where id=%s",[a.pk]); at=c.fetchone()[0]
                        c.execute("select pg_xact_commit_timestamp(xmin) from booking_blockedperiod where id=%s",[b.pk]); bt=c.fetchone()[0]
                        print("ROW_COMMIT_TIMES","booking",str(at),"block_last_version",str(bt))
            PY
            echo "=== HISTORICAL_BACKUPS_METADATA ==="
            python3 - <<'PY'
            from pathlib import Path
            from datetime import datetime,timezone
            roots=["/opt/aesthetic-book","/var/backups","/root"]
            suffixes=(".sql",".dump",".bak",".backup",".gz",".zip",".sqlite",".sqlite3",".json")
            found=[]
            for root in roots:
                p=Path(root)
                if not p.exists(): continue
                for item in p.glob("**/*"):
                    try:
                        if not item.is_file(): continue
                        if not any(item.name.lower().endswith(x) for x in suffixes) and "backup" not in item.name.lower(): continue
                        st=item.stat()
                        if st.st_size < 2000: continue
                        d=datetime.fromtimestamp(st.st_mtime,timezone.utc)
                        if d.year!=2026: continue
                        found.append((d,item))
                    except (OSError,PermissionError): continue
                    if len(found)>2500: break
            print("BACKUP_CANDIDATES_TOTAL",len(found))
            for day in sorted(set(d.strftime("%Y-%m-%d") for d,_ in found)):
                if "2026-10-10"<=day<="2026-11-04":
                    p=[x for x in found if x[0].strftime("%Y-%m-%d")==day]
                    print("BACKUP_DAY",day,"count",len(p),"types",sorted(set(item.suffix for _,item in p))[:12])
            PY
            echo "INCIDENT_AUDIT_COMPLETE"