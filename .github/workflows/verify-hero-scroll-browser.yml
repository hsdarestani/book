name: Mobile hero admin scroll browser regression
on:
  pull_request:
    branches: [main]
    paths:
      - "templates/booking/app_management.html"
      - "templates/booking/admin_more.html"
      - "static/booking/admin-unified-nav-v14.js"
      - "booking/test_home_hero_admin.py"
      - "booking/test_hero_scroll_browser.py"
      - "booking/test_management_mobile_browser.py"
      - "static/booking/admin-calendar-scroll-v5.css"
      - "static/booking/admin-calendar-date-dock-v7.css"
      - "templates/booking/_mobile_calendar_date_dock.html"
      - "booking/views.py"
      - "static/booking/admin-calendar-iphone-v1.js"
      - "templates/booking/dashboard.html"
      - "static/booking/clinic-patient-wallet-finish-v4.css"
      - ".github/workflows/verify-hero-scroll-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-mobile-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install app and browser test dependencies
        run: |
          pip install -r requirements.txt
          pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Verify native Android-size scroll and menu
        env:
          DJANGO_DEBUG: '1'
        run: |
          python manage.py check
          python manage.py test booking.test_home_hero_admin booking.test_hero_scroll_browser booking.test_management_mobile_browser --verbosity 2
          node --check static/booking/admin-unified-nav-v14.js
