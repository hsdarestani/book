name: Verify mobile booking 409 recovery

on:
  pull_request:
    branches: [main]
    paths:
      - "booking/mobile_api.py"
      - "booking/test_mobile_booking_recovery.py"
      - ".github/workflows/verify-mobile-booking-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate syntax, migration safety and focused regression
        env:
          DJANGO_DEBUG: '1'
        run: |
          python -m py_compile booking/mobile_api.py booking/test_mobile_booking_recovery.py
          python manage.py check
          python manage.py test booking.test_mobile_booking_recovery --verbosity 2
