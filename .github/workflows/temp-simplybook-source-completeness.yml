name: Temporary SimplyBook source completeness audit
on:
  push:
    branches: [audit/esthetic-sync-identity-20261022]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate source completeness and timer health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 4m
          script: |
            set -euo pipefail
            source /etc/aesthetic-simplybook-credentials.env
            export SIMPLYBOOK_COMPANY_LOGIN SIMPLYBOOK_USER_LOGIN SIMPLYBOOK_USER_PASSWORD SIMPLYBOOK_API_USER_KEY
            AUDIT_CODE="$(cat <<'PY'
            import json,os
            from collections import Counter
            from booking.customer_identity import normalize_phone,normalize_email,normalize_name
            from booking.management.commands.simplybook_import import rpc,LOGIN_URL,ADMIN_URL
            from booking.models import Customer,Appointment
            company=os.getenv("SIMPLYBOOK_COMPANY_LOGIN");user=os.getenv("SIMPLYBOOK_USER_LOGIN")
            secret=os.getenv("SIMPLYBOOK_API_USER_KEY") or os.getenv("SIMPLYBOOK_USER_PASSWORD")
            token=rpc(LOGIN_URL,"getUserToken",[company,user,secret],timeout=30)
            headers={"X-Company-Login":company,"X-User-Token":token}
            raw=rpc(ADMIN_URL,"getClientList",["",None],headers=headers,timeout=90)
            bookings=rpc(ADMIN_URL,"getBookings",[{"date_from":"2000-01-01","date_to":"2035-12-31","booking_type":"all","order":"date_start_asc"}],headers=headers,timeout=90)
            src=[x for x in raw if isinstance(x,dict)]
            emails=Counter(normalize_email(x.get("email")) for x in src)
            phones=Counter(normalize_phone(x.get("phone")) for x in src)
            ids=Counter(str(x.get("id") or "") for x in src)
            names=Counter(normalize_name(x.get("name")) for x in src)
            local=list(Customer.objects.values("email","phone","first_name","last_name"))
            lemails={normalize_email(x["email"]) for x in local if normalize_email(x["email"])}
            lphones={normalize_phone(x["phone"]) for x in local if normalize_phone(x["phone"])}
            source_emails={x for x in emails if x}
            source_phones={x for x in phones if x}
            client_ids={str(x.get("id") or "") for x in src}
            bclient_ids=[str(x.get("client_id") or "") for x in bookings if isinstance(x,dict)]
            source_booking_ids={str(x.get("id") or "") for x in bookings if isinstance(x,dict)}
            local_booking_ids={k.replace("simplybook-","",1) for k in Appointment.objects.filter(idempotency_key__startswith="simplybook-").values_list("idempotency_key",flat=True)}
            report={"source_client_rows":len(src),"source_unique_ids":len({i for i in ids if i}),"source_duplicate_ids":sum(n-1 for i,n in ids.items() if i),"source_distinct_emails":len(source_emails),"source_distinct_phones":len(source_phones),"source_no_email":emails[""],"source_no_phone":phones[""],"source_repeated_email_ids":sum(n-1 for e,n in emails.items() if e),"source_repeated_phone_ids":sum(n-1 for e,n in phones.items() if e),"source_distinct_names":len(names),"source_email_covered_in_local":len(source_emails & lemails),"source_phone_covered_in_local":len(source_phones & lphones),"source_email_not_covered_in_local":len(source_emails-lemails),"source_phone_not_covered_in_local":len(source_phones-lphones),"source_bookings":len(bookings),"source_booking_ids_distinct":len(source_booking_ids),"local_simplybook_appointment_ids":len(local_booking_ids),"local_source_booking_intersection":len(source_booking_ids & local_booking_ids),"source_bookings_missing_local":len(source_booking_ids-local_booking_ids),"local_source_bookings_absent_from_source":len(local_booking_ids-source_booking_ids),"source_bookings_with_missing_client_id":sum(not cid for cid in bclient_ids),"source_bookings_with_unknown_client_id":sum(bool(cid) and cid not in client_ids for cid in bclient_ids),"source_getClientList_sample_id_types":dict(Counter(type(x.get("id")).__name__ for x in src))}
            print("SOURCE_COVERAGE_AUDIT="+json.dumps(report,sort_keys=True))
            
            PY
            )"
            export AUDIT_CODE
            runuser -u aestheticbook --preserve-environment -- bash -c 'set -a; source /etc/aesthetic-book.env; set +a; cd /opt/aesthetic-book/app; /opt/aesthetic-book/venv/bin/python manage.py shell -c "$AUDIT_CODE"'
            systemctl is-active aesthetic-simplybook-sync.timer
            systemctl list-timers aesthetic-simplybook-sync.timer --no-pager
