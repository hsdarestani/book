name: Audit private record rendering
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-record-render.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect file format and response without patient content
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            runuser -u aestheticbook -- bash -c "set -a; source /etc/aesthetic-book.env; set +a; /opt/aesthetic-book/venv/bin/python manage.py shell <<'PY'
            from pathlib import Path
            from django.test import RequestFactory
            from django.contrib.auth import get_user_model
            from booking.models import PatientRecord
            from booking.views import _patient_file_path, patient_record_file
            row=PatientRecord.objects.get(public_id='c7d54c6e-b563-418c-8917-f3fee0183dbb',customer_id=1123)
            path=_patient_file_path(row.stored_name)
            print('RECORD_FORMAT',row.mime_type,'EXTENSION',Path(row.original_name).suffix,'DECLARED_SIZE',row.file_size)
            print('FILE_PRESENT',path.is_file())
            if path.is_file():
                with path.open('rb') as handle:
                    magic=handle.read(16)
                print('ACTUAL_SIZE',path.stat().st_size,'PDF_MAGIC',magic.startswith(b'%PDF-'),'PNG_MAGIC',magic.startswith(b'\x89PNG'),'JPEG_MAGIC',magic.startswith(b'\xff\xd8'),'ZIP_MAGIC',magic.startswith(b'PK'))
                req=RequestFactory().get('/verwaltung/patienten/1123/datei/'+str(row.public_id)+'/')
                req.user=get_user_model().objects.filter(is_superuser=True,is_active=True).first()
                req.session={}
                response=patient_record_file(req,1123,row.public_id)
                print('RESPONSE_STATUS',response.status_code,'CONTENT_TYPE',response.get('Content-Type'),'LENGTH',response.get('Content-Length'),'FRAME_POLICY',response.get('X-Frame-Options'))
                response.close()
            PY"
