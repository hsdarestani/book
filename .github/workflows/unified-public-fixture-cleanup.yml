name: Retry cleanup of the isolated public-booking fixture

on:
  push:
    branches: [qa/unified-public-fixture-cleanup-b70]
    paths: ['.github/workflows/unified-public-fixture-cleanup.yml']

permissions:
  contents: read

concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false

env:
  UNIFIED_BOOK_DEPLOYED_REVISION: 81ccfa136d0ed44cdaea959fae45982d98df8a92
  UNIFIED_FIXTURE_WORKFLOW_REVISION: ${{ github.sha }}

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify cancellation and clean up only the exact timed synthetic fixture
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: UNIFIED_BOOK_DEPLOYED_REVISION,UNIFIED_FIXTURE_WORKFLOW_REVISION
          command_timeout: 9m
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            exec 9>/opt/aesthetic-book/remediation-rollbacks/release.lock
            flock -w 30 9
            test "$(git rev-parse HEAD)" = "$UNIFIED_BOOK_DEPLOYED_REVISION"
            systemctl is-active --quiet aesthetic-book
            git fetch -q --no-tags origin "$UNIFIED_FIXTURE_WORKFLOW_REVISION"
            source /etc/aesthetic-simplybook-credentials.env
            export SIMPLYBOOK_OUTBOUND_ENABLED=1 SIMPLYBOOK_ADMIN_WRITEBACK_ENABLED=true
            exec 8>/var/lock/aesthetic-simplybook-sync.lock
            flock -w 60 8
            git show "$UNIFIED_FIXTURE_WORKFLOW_REVISION:scripts/unified_public_fixture_cleanup.py" |
              runuser -u aestheticbook --preserve-environment -- bash -c 'set -a; source /etc/aesthetic-book.env; set +a; DJANGO_SETTINGS_MODULE=config.settings exec /opt/aesthetic-book/venv/bin/python -c "import django,sys; django.setup(); exec(compile(sys.stdin.read(), \"synthetic_cleanup\", \"exec\"))"'
