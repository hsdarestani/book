name: Verify fast outbound worker activation
on:
  push:
    branches: [ops/verify-fast-outbound-worker-20261128]
    paths: ['.github/workflows/verify-fast-outbound-worker-20261128.yml']
permissions:
  contents: read
concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            exec 9>/opt/aesthetic-book/remediation-rollbacks/release.lock
            flock -n 9
            test "$(git rev-parse HEAD)" = 95cd6fecf55ee4b45cf2a5b7675fc85e9870373e
            systemctl is-active --quiet aesthetic-book-alerts.timer aesthetic-book-outbound.timer aesthetic-simplybook-sync.timer
            systemctl show aesthetic-simplybook-sync.service -p Environment --value | tr ' ' '\n' | grep -Fx 'SIMPLYBOOK_OUTBOUND_ENABLED=1' >/dev/null
            config=/etc/systemd/system/aesthetic-book-outbound.service.d/58-simplybook-outbound.conf
            test ! -e "$config"
            mkdir -p "$(dirname "$config")"
            printf '%s\n' '[Service]' 'Environment=SIMPLYBOOK_OUTBOUND_ENABLED=1' > "$config"
            systemctl daemon-reload
            systemctl restart aesthetic-book-outbound.timer
            systemctl show aesthetic-book-outbound.service -p Environment --value | tr ' ' '\n' | grep -Fx 'SIMPLYBOOK_OUTBOUND_ENABLED=1' >/dev/null
            pid=$(systemctl show aesthetic-book.service -p MainPID --value)
            grep -zFx 'MOBILE_ADMIN_DEFER_SOURCE_CHECK=1' "/proc/$pid/environ" >/dev/null
            systemctl is-active --quiet aesthetic-book-alerts.timer aesthetic-book-outbound.timer
            echo FAST_BOOKING_WORKERS_VERIFIED=yes
