name: Correct Botox existing-patient buffer (no restart, exact-match guard)

on:
  push:
    branches:
      - audit/book-botox-duration-20261122
    paths:
      - ".github/workflows/fix-book-botox-existing-buffer.yml"

permissions:
  contents: read

concurrency:
  group: one-time-book-botox-buffer-correction
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guarded zero-restart correction of one service configuration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            APP_DIR=/opt/aesthetic-book/app
            test -f /etc/aesthetic-book.env
            test -x /opt/aesthetic-book/venv/bin/python
            systemctl is-active --quiet aesthetic-book
            # Fail closed before changing any data if booking is not healthy.
            curl --fail --silent --show-error --max-time 15 https://book.a-esthetic.de/api/health/ >/dev/null
            cd "$APP_DIR"
            runuser -u aestheticbook -- bash -c 'set -a; source /etc/aesthetic-book.env; set +a; /opt/aesthetic-book/venv/bin/python manage.py shell' <<'PY'
            from django.db import transaction
            from booking.models import Service
            with transaction.atomic():
                service = Service.objects.select_for_update().get(pk=11, slug="botox-bestandspatient")
                if not (service.active and service.bookable and service.duration_minutes == 15):
                    raise RuntimeError("Unexpected live service configuration; refusing correction")
                if service.buffer_minutes not in (0, 10):
                    raise RuntimeError("Unexpected live buffer; refusing correction")
                previous_buffer = service.buffer_minutes
                if previous_buffer == 10:
                    service.buffer_minutes = 0
                    service.save(update_fields=["buffer_minutes"])
                print("Clinic Botox existing-patient service:", service.pk, service.slug)
                print("Duration:", service.duration_minutes, "buffer before:", previous_buffer, "buffer now:", service.buffer_minutes)
                assert service.duration_minutes + service.buffer_minutes == 15
            PY
            # No service restart, deployment, migration, or patient-record edit.
            systemctl is-active --quiet aesthetic-book
            curl --fail --silent --show-error --max-time 15 https://book.a-esthetic.de/api/health/ >/dev/null
            printf 'Post-write booking service health: OK; no service restart performed\n'
