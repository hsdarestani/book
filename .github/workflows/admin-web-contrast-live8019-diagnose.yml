name: Identify live Book port 8019 service
on:
  push:
    branches: ['ops/admin-v4-production-preflight-20261124']
    paths: ['.github/workflows/admin-web-contrast-live8019-diagnose.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            ss -ltnp 'sport = :8019'
            pids=$(ss -ltnp 'sport = :8019' | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u)
            for pid in $pids; do
              echo "PID=$pid CWD=$(readlink -f /proc/$pid/cwd)"
              cat /proc/$pid/cgroup
              ps -p "$pid" -o comm=,user=,ppid=
            done
            for unit in $(for pid in $pids; do grep -oE '[^/]+\.service' /proc/$pid/cgroup; done | sort -u); do
              systemctl show "$unit" -p Id -p WorkingDirectory -p MainPID -p User -p EnvironmentFiles -p FragmentPath
            done
            echo LIVE_PORT_IDENTIFIED
