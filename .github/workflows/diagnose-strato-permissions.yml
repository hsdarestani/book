name: Diagnose STRATO execution permissions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-strato-permissions.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Audit booking production runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            APP_ROOT=/opt/aesthetic-book
            APP="$APP_ROOT/app"
            VENV="$APP_ROOT/venv"
            ENV_FILE=/etc/aesthetic-book.env
            test -x "$VENV/bin/python"
            test -s "$ENV_FILE"
            systemctl is-active --quiet aesthetic-book.service
            systemctl is-active --quiet postgresql.service
            systemctl is-active --quiet nginx.service
            nginx -t
            cd "$APP"
            runuser -u aestheticbook -- /bin/bash -c "set -a; source '$ENV_FILE'; set +a; '$VENV/bin/python' manage.py check"
            echo 'BOOK_DJANGO_CHECK=success'

            runuser -u aestheticbook -- /bin/bash -c "set -a; source '$ENV_FILE'; set +a; '$VENV/bin/python' manage.py shell -c \"from booking.models import Customer,Appointment,Service,StaffMember,PatientRecord; import json; print('BOOK_COUNTS='+json.dumps({'customers':Customer.objects.count(),'appointments':Appointment.objects.count(),'services':Service.objects.count(),'staff':StaffMember.objects.count(),'patient_records':PatientRecord.objects.count()},sort_keys=True))\""

            runuser -u aestheticbook -- /bin/bash -c "set -a; source '$ENV_FILE'; set +a; '$VENV/bin/python' manage.py shell -c \"from django.core.mail import get_connection; c=get_connection(); result=c.open(); print('SMTP_CONNECTION=success'); c.close()\""

            test -s /etc/aesthetic-patient-sync.token
            echo 'PATIENT_SYNC_TOKEN=present'
            curl -fsS --max-time 20 https://book.a-esthetic.de/api/health/ | grep -q '"ok"'
            curl -fsS --max-time 20 https://book.a-esthetic.de/static/booking/app.css | grep -q '.booking-shell'
            curl -fsSI --max-time 20 https://book.a-esthetic.de/ >/dev/null
            echo 'BOOK_PUBLIC_ENDPOINTS=success'
            echo 'BOOK_RUNTIME_AUDIT=PASS'
