name: Guarded final calendar asset version refresh
on:
  push:
    branches: [release/calendar-editability-cache-version-20261127]
    paths: ['.github/workflows/release-calendar-cache-version.yml']
permissions:
  contents: read
concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Refresh only the versioned loader after tested compression repair
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            exec 9>/opt/aesthetic-book/remediation-rollbacks/release.lock
            flock -n 9
            base=a1f810c9acc2fd5c04de186f5b2326b86879227a
            candidate=63be10984ee35862bc88fcc15f312fea506b1ed7
            target=staticfiles/booking/admin.js
            test "$(git rev-parse HEAD)" = "$base"
            test -z "$(git status --porcelain --untracked-files=no)"
            systemctl is-active --quiet aesthetic-book
            git fetch -q --no-tags origin "$candidate"
            test "$(git rev-parse "$candidate^")" = "$base"
            test "$(git diff --name-only "$base" "$candidate" | sort)" = "$(printf '%s\n' static/booking/admin.js templates/booking/dashboard.html | sort)"
            cmp -s "$target" static/booking/admin.js
            gzip -dc "$target.gz" | cmp -s - "$target"
            backup=$(mktemp -d /opt/aesthetic-book/remediation-rollbacks/calendar-cache-version-20261127.XXXXXX)
            for suffix in '' .gz .br; do
              if test -f "$target$suffix"; then cp -a "$target$suffix" "$backup/admin.js$suffix"; fi
              test ! -e "$target$suffix.version-tmp"
            done
            switched=0
            finish() {
              result=$?
              trap - EXIT
              if [ "$result" != 0 ] && [ "$switched" = 1 ]; then
                for suffix in '' .gz .br; do
                  if test -f "$backup/admin.js$suffix"; then cp -a --remove-destination "$backup/admin.js$suffix" "$target$suffix" || result=2; fi
                done
                git switch -q --no-overwrite-ignore --detach "$base" &&
                  systemctl restart aesthetic-book && systemctl is-active --quiet aesthetic-book || result=2
                echo CACHE_VERSION_ROLLBACK=attempted
              fi
              for suffix in '' .gz .br; do rm -f "$target$suffix.version-tmp"; done
              exit "$result"
            }
            trap finish EXIT
            git switch -q --no-overwrite-ignore --detach "$candidate"
            switched=1
            cp -a "$target" "$target.version-tmp"
            cp static/booking/admin.js "$target.version-tmp"
            mv "$target.version-tmp" "$target"
            cp -a "$target.gz" "$target.gz.version-tmp"
            gzip -n -9 -c "$target" > "$target.gz.version-tmp"
            gzip -dc "$target.gz.version-tmp" | cmp -s - "$target"
            mv "$target.gz.version-tmp" "$target.gz"
            if test -f "$target.br"; then
              cp -a "$target.br" "$target.br.version-tmp"
              if command -v brotli >/dev/null; then
                brotli -q 11 -c "$target" > "$target.br.version-tmp"
                brotli -dc "$target.br.version-tmp" | cmp -s - "$target"
              else
                /opt/aesthetic-book/venv/bin/python -c 'import brotli,sys; x=open(sys.argv[1],"rb").read(); z=brotli.compress(x); assert brotli.decompress(z)==x; sys.stdout.buffer.write(z)' "$target" > "$target.br.version-tmp"
              fi
              mv "$target.br.version-tmp" "$target.br"
            fi
            systemctl restart aesthetic-book
            for attempt in {1..12}; do
              if systemctl is-active --quiet aesthetic-book && curl -fsS --max-time 8 https://book.a-esthetic.de/api/health/ -o /dev/null; then break; fi
              sleep 2
            done
            systemctl is-active --quiet aesthetic-book
            systemctl is-active --quiet aesthetic-simplybook-sync.timer
            curl -fsS --max-time 8 https://book.a-esthetic.de/api/health/ -o /dev/null
            for name in admin.js admin-calendar-plus.js; do
              expected=$(sha256sum "static/booking/$name" | cut -d' ' -f1)
              for encoding in identity gzip; do
                actual=$(curl -fsS --compressed --max-time 15 -H "Accept-Encoding: $encoding" -H 'Cache-Control: no-cache' "https://book.a-esthetic.de/static/booking/$name?v=20261127-source-revisions-r2" | sha256sum | cut -d' ' -f1)
                test "$expected" = "$actual"
              done
            done
            echo FINAL_CACHE_SAFE_ASSETS_VERIFIED=yes
