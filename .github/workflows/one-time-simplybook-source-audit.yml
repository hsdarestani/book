# Temporary read-only source audit. Do not merge. Logs contain aggregated counts only.
name: One-time SimplyBook source audit
on:
  push:
    branches: [audit/esthetic-simplybook-source-20261022]
permissions:
  contents: read
jobs:
  read-only-comparison:
    runs-on: ubuntu-latest
    steps:
      - name: Compare anonymized patient stats with SimplyBook
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            source /etc/aesthetic-simplybook-credentials.env
            export SIMPLYBOOK_COMPANY_LOGIN SIMPLYBOOK_USER_LOGIN SIMPLYBOOK_USER_PASSWORD SIMPLYBOOK_API_USER_KEY
            AUDIT_CODE="$(cat <<'PY'
            from collections import Counter, defaultdict
            import json
            from django.utils import timezone
            from booking.customer_identity import normalize_email, normalize_phone, normalize_name
            from booking.models import Customer, Appointment, ExternalSyncState
            from booking.management.commands.simplybook_import import rpc, LOGIN_URL, ADMIN_URL
            import os
            all_rows = list(Customer.objects.all().only("pk","first_name","last_name","email","phone","created_at","updated_at"))
            anon = [x for x in all_rows if not normalize_phone(x.phone) and not normalize_email(x.email)]
            pfx=lambda x: ("simplybook-client" if x.email.startswith("simplybook-client-") else "simplybook-booking" if x.email.startswith("simplybook-booking-") else "legacy" if x.email.startswith("legacy-") else "other")
            kind_count = Counter(pfx(x) for x in anon)
            name_count = Counter((normalize_name(x.first_name),normalize_name(x.last_name)) for x in anon)
            booked = set(Appointment.objects.values_list("customer_id", flat=True).distinct())
            source_booked = set(Appointment.objects.filter(idempotency_key__startswith="simplybook-").values_list("customer_id", flat=True).distinct())
            aud = {
             "total_rows":len(all_rows), "no_real_email_or_phone":len(anon),
             "placeholder_kinds":dict(kind_count),
             "all_placeholder_names_identical":len(name_count)==1,
             "name_is_import_default":len(name_count)==1 and ("simplybook","kunde") in name_count,
             "associated_with_any_appointment":sum(x.pk in booked for x in anon),
             "associated_with_simplybook_appointment":sum(x.pk in source_booked for x in anon),
             "unbooked_rows":sum(x.pk not in booked for x in anon),
            }
            try:
             state=ExternalSyncState.objects.filter(source="simplybook").first()
             aud["sync_last_success"]=state.last_success_at.isoformat() if state and state.last_success_at else None
            except Exception:
             aud["sync_last_success"]="unavailable"
            company=os.environ.get("SIMPLYBOOK_COMPANY_LOGIN","")
            user=os.environ.get("SIMPLYBOOK_USER_LOGIN","")
            credential=os.environ.get("SIMPLYBOOK_API_USER_KEY") or os.environ.get("SIMPLYBOOK_USER_PASSWORD","")
            if not (company and user and credential):
             aud["source_check"]="credentials_unavailable"
            else:
             try:
              token=rpc(LOGIN_URL,"getUserToken",[company,user,credential],timeout=30)
              if not token: raise ValueError("empty_token")
              headers={"X-Company-Login":company,"X-User-Token":token}
              clients=rpc(ADMIN_URL,"getClientList",["",None],headers=headers,timeout=90) or []
              if not isinstance(clients,list): raise TypeError("invalid_clients_shape")
              cmap={str(x.get("id")):x for x in clients if isinstance(x,dict) and x.get("id") is not None}
              ids=[str(x.email[len("simplybook-client-"):-len("@invalid.local")]) for x in anon if pfx(x)=="simplybook-client" and x.email.endswith("@invalid.local")]
              live=[cmap.get(x) for x in ids if x in cmap]
              missing_count=sum(x not in cmap for x in ids)
              fresh_contact=sum(bool(str(x.get("phone") or "").strip()) or bool(normalize_email(x.get("email"))) for x in live)
              fresh_name=sum(bool(str(x.get("name") or "").strip()) for x in live)
              alt_fields=Counter()
              if clients:
               candidate=next((x for x in clients if isinstance(x,dict)),{})
               aud["source_client_keys"] = sorted(str(k) for k in candidate.keys())[:40]
              for x in live:
               for k,v in x.items():
                if k not in {"id","name","phone","email"} and any(t in str(k).lower() for t in ("name","phone","email","mobile","contact","tel","first","last")) and str(v or "").strip():
                 alt_fields[str(k)]+=1
              aud.update({"source_check":"ok","source_client_total":len(clients),"placeholder_clients_present_live":len(live),"placeholder_clients_missing_live":missing_count,"live_has_usable_name_for_placeholder":fresh_name,"live_has_real_contact_for_placeholder":fresh_contact,"alternate_contact_field_counts":dict(alt_fields),
               "source_clients_missing_name":sum(not str(x.get("name") or "").strip() for x in clients if isinstance(x,dict)),
               "source_clients_missing_email_phone":sum(not normalize_email(x.get("email")) and not normalize_phone(x.get("phone")) for x in clients if isinstance(x,dict)),
               "source_clients_missing_all_three":sum(not str(x.get("name") or "").strip() and not normalize_email(x.get("email")) and not normalize_phone(x.get("phone")) for x in clients if isinstance(x,dict))
              })
              # Compare booking origin for synthetic booking placeholders (no personal identifiers printed).
              bs=[x for x in anon if pfx(x)=="simplybook-booking" and x.email.endswith("@invalid.local")]
              if bs:
               bookings=rpc(ADMIN_URL,"getBookings",[{"date_from":"2000-01-01","date_to":"2035-12-31","booking_type":"all","order":"date_start_asc"}],headers=headers,timeout=90) or []
               bmap={str(x.get("id")):x for x in bookings if isinstance(x,dict) and x.get("id") is not None}
               bids=[x.email[len("simplybook-booking-"):-len("@invalid.local")] for x in bs]
               found=[bmap[id] for id in bids if id in bmap]
               aud.update({"source_booking_total":len(bookings),"placeholder_booking_fallback_present_live":len(found),
                "placeholder_booking_fallback_missing_live":sum(id not in bmap for id in bids),
                "live_booking_fallback_has_name":sum(bool(str(x.get("client") or "").strip()) for x in found),
                "live_booking_fallback_has_contact":sum(bool(str(x.get("client_phone") or "").strip()) or bool(normalize_email(x.get("client_email"))) for x in found)})
             except Exception as e:
              aud["source_check"]="failed"
              aud["source_error_type"]=type(e).__name__
            # Verify referential integrity: raw booking -> SimplyBook client list -> local appointment.
            try:
             if aud.get("source_check")=="ok" and 'bookings' not in locals():
              bookings=rpc(ADMIN_URL,"getBookings",[{"date_from":"2000-01-01","date_to":"2035-12-31","booking_type":"all","order":"date_start_asc"}],headers=headers,timeout=90) or []
              bmap={str(x.get("id")):x for x in bookings if isinstance(x,dict) and x.get("id") is not None}
              aud["source_booking_total"]=len(bookings)
             if aud.get("source_check")=="ok":
              fallback_ids=[x.email[len("simplybook-booking-"):-len("@invalid.local")] for x in anon if pfx(x)=="simplybook-booking" and x.email.endswith("@invalid.local")]
              selected=[bmap[x] for x in fallback_ids if x in bmap]
              selected_ref=Counter()
              source_names_with_id=0
              source_client_contact_with_id=0
              external_ids=set()
              for row in selected:
               cid=str(row.get("client_id") or "").strip()
               selected_ref["client_id_present" if cid else "client_id_empty"]+=1
               if cid and cid in cmap:
                selected_ref["client_id_found_in_getClientList"]+=1
                profile=cmap[cid]
                if str(profile.get("name") or "").strip():source_names_with_id+=1
                if normalize_phone(profile.get("phone")) or normalize_email(profile.get("email")):source_client_contact_with_id+=1
               elif cid:
                selected_ref["client_id_not_in_getClientList"]+=1
               bid=str(row.get("id") or "").strip()
               if bid:external_ids.add("simplybook-"+bid)
              associated=list(Appointment.objects.filter(idempotency_key__in=external_ids).values_list("idempotency_key","customer__email"))
              counter=Counter()
              for key,em in associated:
               if em.startswith("simplybook-booking-") and em.endswith("@invalid.local"):counter["appointment_still_using_synthetic_fallback"]+=1
               else:counter["appointment_using_different_customer"]+=1
              aud["placeholder_source_client_links"]=dict(selected_ref)
              aud["placeholder_source_client_has_name"]=source_names_with_id
              aud["placeholder_source_client_has_contact"]=source_client_contact_with_id
              aud["corresponding_local_appointments_found"]=len(associated)
              aud["local_appointment_customer_categories"]=dict(counter)
              aud["source_booking_rows_without_client_id"]=sum(not str(x.get("client_id") or "").strip() for x in bookings if isinstance(x,dict))
              aud["source_booking_rows_client_id_not_in_client_list"]=sum(bool(str(x.get("client_id") or "").strip()) and str(x.get("client_id") or "").strip() not in cmap for x in bookings if isinstance(x,dict))
              aud["source_booking_rows_client_id_in_client_list"]=sum(str(x.get("client_id") or "").strip() in cmap for x in bookings if isinstance(x,dict))
            except Exception as exc:
             aud["source_relationship_check"]="failed"
             aud["source_relationship_error_type"]=type(exc).__name__
            # Compare synthetic email counts: repeated creation used to produce orphan clones.
            counts=Counter(x.email for x in anon if x.email.startswith("simplybook-booking-"))
            aud["synthetic_booking_distinct_email_keys"]=len(counts)
            aud["synthetic_booking_clone_group_sizes"]=sorted(counts.values(),reverse=True)[:12]
            aud["synthetic_booking_extra_clones"]=sum(max(0,count-1) for count in counts.values())
            aud["anonymous_created_by_day_counts"]=dict(sorted(Counter(x.created_at.strftime("%Y-%m-%d") for x in anon).items()))
            aud["anonymous_last_created_day"]=max((x.created_at.strftime("%Y-%m-%d") for x in anon),default=None)
            print("SIMPLYBOOK_ANON_AUDIT="+json.dumps(aud,sort_keys=True))
            
            PY
            )"
            export AUDIT_CODE
            runuser -u aestheticbook --preserve-environment -- bash -c 'set -a; source /etc/aesthetic-book.env; set +a; cd /opt/aesthetic-book/app; /opt/aesthetic-book/venv/bin/python manage.py shell -c "$AUDIT_CODE"'
