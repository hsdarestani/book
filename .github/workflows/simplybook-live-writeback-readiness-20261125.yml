name: Verify actual live SimplyBook writeback readiness (no patient mutations)
on:
  push:
    branches: ['ops/admin-v4-production-preflight-20261124']
    paths: ['.github/workflows/simplybook-live-writeback-readiness-20261125.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 6m
          script: |
            set -euo pipefail
            nginx -T 2>/dev/null | grep -F 'proxy_pass http://127.0.0.1:8019;' >/dev/null
            pids=$(ss -ltnp 'sport = :8019' | grep -oE 'pid=[0-9]+' | cut -d= -f2 | sort -u)
            units=$(for pid in $pids; do grep -oE '[^/]+\.service' /proc/$pid/cgroup; done | sort -u)
            test "$(printf '%s\n' "$units" | wc -l)" -eq 1
            SERVICE="$units"
            case "$SERVICE" in *book*.service|*Book*.service) ;; *) exit 1;; esac
            master=$(systemctl show "$SERVICE" -p MainPID --value)
            APP=$(readlink -f "/proc/$master/cwd")
            echo "LIVE_TARGET $SERVICE $APP"
            systemctl is-active --quiet "$SERVICE"
            test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://book.a-esthetic.de/api/health/)" = 200
            test "$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' https://book.a-esthetic.de/api/mobile/staff/catalog/)" = 401
            python3 - "$master" "$APP" <<'PY'
            import sys,pathlib
            pid,root=sys.argv[1:]
            env=dict(x.split(b'=',1) for x in pathlib.Path('/proc/'+pid+'/environ').read_bytes().split(b'\0') if b'=' in x)
            print('LIVE_WRITEBACK_FLAG',env.get(b'SIMPLYBOOK_ADMIN_WRITEBACK_ENABLED',b'').lower()==b'true')
            print('LIVE_CREDENTIALS_PRESENT',all(env.get(x) for x in (b'SIMPLYBOOK_COMPANY_LOGIN',b'SIMPLYBOOK_USER_LOGIN')) and bool(env.get(b'SIMPLYBOOK_API_USER_KEY') or env.get(b'SIMPLYBOOK_USER_PASSWORD')))
            app=pathlib.Path(root)
            f=app/'booking/simplybook_writeback.py'
            print('LIVE_WRITEBACK_IMPLEMENTATION',f.is_file())
            a=app/'booking/mobile_staff_api.py'
            print('LIVE_CONTROLLER_WRITEBACK',a.is_file() and 'write_existing_booking' in a.read_text())
            PY
            test -r /etc/aesthetic-simplybook-credentials.env
            systemctl is-active aesthetic-simplybook-sync.timer
            systemctl show aesthetic-simplybook-sync.service -p Result -p ExecMainStatus --no-pager
            cd "$APP"
            set -a
            source /etc/aesthetic-book.env
            source /etc/aesthetic-simplybook-credentials.env
            set +a
            /opt/aesthetic-book/venv/bin/python manage.py shell <<'PY'
            import os,re
            from datetime import date,timedelta
            from booking.management.commands.simplybook_import import rpc,ADMIN_URL,LOGIN_URL
            company=os.getenv('SIMPLYBOOK_COMPANY_LOGIN','').strip()
            user=os.getenv('SIMPLYBOOK_USER_LOGIN','').strip()
            key=(os.getenv('SIMPLYBOOK_API_USER_KEY') or os.getenv('SIMPLYBOOK_USER_PASSWORD') or '').strip()
            assert company and user and key
            token=rpc(LOGIN_URL,'getUserToken',[company,user,key],timeout=20)
            assert token
            h={'X-Company-Login':company,'X-User-Token':token}
            print('ADMIN_API_READ_AUTH_OK')
            services=rpc(ADMIN_URL,'getEventList',[False,True,None,''],headers=h,timeout=20) or []
            providers=rpc(ADMIN_URL,'getUnitList',[False,True,None,''],headers=h,timeout=20) or []
            clients=rpc(ADMIN_URL,'getClientList',['',None],headers=h,timeout=30) or []
            qa=lambda x: bool(re.search(r'(?i)(^|\b)(qa|sandbox|synthetic|testbuchung|testtermin|test service|test provider|integration test)(\b|$)',str(x or '')))
            safe_email=lambda x: bool(re.search(r'(?i)@(example\.(invalid|test)|[a-z0-9.-]+\.invalid|[a-z0-9.-]+\.test)$',str(x or '').strip()))
            test_services={str(x.get('id')) for x in services if isinstance(x,dict) and qa(x.get('name') or x.get('title'))}
            test_providers={str(x.get('id')) for x in providers if isinstance(x,dict) and qa(x.get('name') or x.get('title'))}
            test_clients={str(x.get('id')) for x in clients if isinstance(x,dict) and safe_email(x.get('email')) and not any(x.get(k) for k in ('phone','phone_number','mobile','mobile_phone')) and qa(x.get('name') or x.get('client_name') or (str(x.get('first_name') or '')+' '+str(x.get('last_name') or '')))}
            rows=rpc(ADMIN_URL,'getBookings',[{'date_from':date.today().isoformat(),'date_to':(date.today()+timedelta(days=60)).isoformat(),'booking_type':'all','order':'date_start_asc'}],headers=h,timeout=30) or []
            candidates=[r for r in rows if isinstance(r,dict) and str(r.get('client_id')) in test_clients and str(r.get('event_id')) in test_services and str(r.get('unit_id')) in test_providers]
            print('QA_SERVICE_COUNT',len(test_services),'QA_PROVIDER_COUNT',len(test_providers),'QA_CLIENT_COUNT',len(test_clients))
            print('ISOLATED_QA_BOOKING_COUNT',len(candidates))
            for r in candidates[:3]:
                d=rpc(ADMIN_URL,'getBookingDetails',[int(r['id'])],headers=h,timeout=15)
                if isinstance(d,dict):
                    print('QA_BOOKING_ID',r['id'],'CONFIRMED',str(d.get('is_confirmed')).lower() in ('1','true'),'HAS_PAYMENT_OR_FIELDS',bool(d.get('price') or d.get('invoice_id') or d.get('promo') or d.get('additional_fields') or d.get('location')))
            print('READINESS_CHECK_COMPLETE_NO_REMOTE_WRITES')
            PY
