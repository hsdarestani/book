name: Guarded Ariane notes and blocked-time activation
on:
  push:
    branches: [fix/simplybook-calendar-writeback-20261127]
    paths: ['.github/workflows/ariane-calendar-activation-20261127.yml']
permissions:
  contents: read
concurrency:
  group: aesthetic-book-production
  cancel-in-progress: false
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Accept both live calendar directions then activate only calendar writes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 7m
          script: |
            set -euo pipefail
            cd /opt/aesthetic-book/app
            exec 9>/opt/aesthetic-book/remediation-rollbacks/release.lock
            flock -w 30 9
            test "$(git rev-parse HEAD)" = b66979a745fec9879052aaf152ba3306e0fa98a0
            systemctl is-active --quiet aesthetic-book
            config=/etc/systemd/system/aesthetic-book.service.d/56-simplybook-calendar-writeback.conf
            test ! -e "$config"
            source /etc/aesthetic-simplybook-credentials.env
            git fetch --no-tags origin 17be10fb1d28a5e1e925073ac941686bda7ee10c
            git show 17be10fb1d28a5e1e925073ac941686bda7ee10c:scripts/ariane_live_book_calendar_acceptance.py |
              runuser -u aestheticbook --preserve-environment -- bash -c 'set -a; source /etc/aesthetic-book.env; set +a; DJANGO_SETTINGS_MODULE=config.settings exec /opt/aesthetic-book/venv/bin/python -c "import django,sys; django.setup(); exec(compile(sys.stdin.read(), \"calendar_acceptance\", \"exec\"))"'
            activated=0
            rollback() {
              status=$?
              trap - EXIT
              if [ "$status" != 0 ] && [ "$activated" = 1 ]; then
                rm -f "$config"
                systemctl daemon-reload
                systemctl restart aesthetic-book
                echo 'SIMPLYBOOK_CALENDAR_ACTIVATION_ROLLED_BACK=true'
              fi
              exit "$status"
            }
            trap rollback EXIT
            install -m 0644 /dev/null "$config"
            activated=1
            printf '%s\n' '[Service]' 'Environment=SIMPLYBOOK_CALENDAR_WRITEBACK_ENABLED=1' > "$config"
            systemctl daemon-reload
            systemctl restart aesthetic-book
            curl -fsS --retry 6 --retry-connrefused --retry-delay 2 --max-time 20 https://book.a-esthetic.de/api/health/ -o /dev/null
            pid=$(systemctl show aesthetic-book -p MainPID --value)
            tr '\0' '\n' < "/proc/$pid/environ" | grep -Fx 'SIMPLYBOOK_CALENDAR_WRITEBACK_ENABLED=1' >/dev/null
            tr '\0' '\n' < "/proc/$pid/environ" | grep -Fx 'SIMPLYBOOK_AVAILABILITY_ENABLED=1' >/dev/null
            echo 'SIMPLYBOOK_ARIANE_CALENDAR_WRITEBACK_ACTIVE=true'
